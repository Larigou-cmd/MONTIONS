<body><canvas id="c" width="1080" height="1920"></canvas><script>
// Vídeo 77: covid voltou a subir e o reforço da vacina. Estilo telejornal (news-package do lemo-opuscar) adaptado
// para vertical: vinheta que vira selo, tarja fixa embaixo, uma informação por tela, carimbos e cortina amarela.
// Telejornal genérico com a marca Farma.exe (nada de emissora real). Tempos tirados de fala.json (30 qps).
const W = 1080, H = 1920, END = 77;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, u) => a + (b - a) * u;
const ss = (a, b, x) => { const u = cl((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const back = u => { const c = 1.70158; u = cl(u) - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const INK = '#121417', INK2 = '#1B1E23', INK3 = '#22262C', ACC = '#F2CF1D', ACCL = '#F8DE4A', ACCD = '#D8B30C', GOLD = '#D4B064', PAPER = '#F4F1E8', HOT = '#FE6B3D', OLIVE = '#6E5A1E', GREEN = '#4FD18B';
const COND = '"Bahnschrift Condensed", "Bahnschrift", "Arial Narrow", sans-serif', HEAD = 'Impact, "Arial Narrow", sans-serif', MONO = 'Consolas, "Courier New", monospace';

const BG = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = INK; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 4; i++) { const gr = x.createLinearGradient(0, 0, W, H); gr.addColorStop(0, 'rgba(242,207,29,0)'); gr.addColorStop(0.45 + i * 0.05, `rgba(242,207,29,${0.025 + i * 0.008})`); gr.addColorStop(0.55 + i * 0.05, 'rgba(242,207,29,0)');
    x.save(); x.translate(W * (0.2 + i * 0.25), 0); x.rotate(0.35); x.fillStyle = gr; x.fillRect(-120, -200, 180, H + 600); x.restore(); }
  x.strokeStyle = 'rgba(255,255,255,0.035)'; x.lineWidth = 1; for (let i = 0; i <= W; i += 60) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); } for (let j = 0; j <= H; j += 60) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
  const v = x.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1200); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); x.fillStyle = v; x.fillRect(0, 0, W, H);
  return c; })();
const LOGO = new Image();

function text(txt, x, y, size, col, align = 'left', a = 1, font = COND, weight = 700, max = 0) { if (a <= 0 || !txt) return; g.save(); g.globalAlpha *= a; g.font = `${weight} ${size}px ${font}`;
  if (max) { const w = g.measureText(txt).width; if (w > max) g.font = `${weight} ${size * max / w}px ${font}`; } g.textAlign = align; g.fillStyle = col; g.fillText(txt, x, y); g.restore(); }
// placa da marca (paralelogramo)
function plate(cx, cy, s, a = 1, glint = -1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.scale(s, s);
  const k = 40; g.beginPath(); g.moveTo(-260 + k, -90); g.lineTo(260 + k, -90); g.lineTo(260 - k, 90); g.lineTo(-260 - k, 90); g.closePath();
  const gr = g.createLinearGradient(0, -90, 0, 90); gr.addColorStop(0, ACCL); gr.addColorStop(1, ACCD); g.fillStyle = gr; g.fill();
  g.save(); g.clip(); g.fillStyle = INK; g.fillRect(-320, -90, 46, 180); g.fillStyle = GOLD; g.fillRect(-274, -90, 14, 180);
  if (glint >= 0 && glint <= 1) { const gx = lerp(-400, 400, glint); const gg = g.createLinearGradient(gx - 60, 0, gx + 60, 0); gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(0.5, 'rgba(255,255,255,0.8)'); gg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gg; g.fillRect(-320, -90, 640, 180); }
  g.restore();
  g.font = `800 96px ${COND}`; g.textAlign = 'center'; g.fillStyle = INK; g.fillText('FARMA.EXE', 0, 34);
  g.font = `700 28px ${MONO}`; g.fillText('NOTÍCIAS DE SAÚDE', 0, 74); g.restore(); }
function bug(a) { plate(905, 130, 0.33, a); }
function eyebrow(txt, y, a) { text(txt, 80, y, 34, GOLD, 'left', a, MONO, 700, 900); }
function cornerTag(txt, a) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.fillStyle = INK3; g.strokeStyle = GOLD; g.lineWidth = 2; g.fillRect(80, 92, 440, 62); g.strokeRect(80, 92, 440, 62); g.restore(); text(txt, 100, 134, 30, GOLD, 'left', a, MONO, 700, 400); }
function card(x, y, w, h, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = INK2; g.fillRect(x, y, w, h); g.fillStyle = ACC; g.fillRect(x, y, w, 8); g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 2; g.strokeRect(x, y, w, h); g.restore(); }
function stamp(txt, cx, cy, t0, t, col = ACC, size = 70, rot = -0.13) { const a = ss(t0, t0 + 0.05, t); if (a <= 0) return; const u = cl((t - t0) / 0.16), s = lerp(1.9, 1, u);
  g.save(); g.globalAlpha = a; g.translate(cx, cy); g.rotate(rot); g.scale(s, s); g.font = `800 ${size}px ${COND}`; const w = g.measureText(txt).width + 70, h = size + 50;
  if (col === ACC) { g.fillStyle = ACC; g.fillRect(-w / 2, -h / 2, w, h); g.fillStyle = INK; } else { g.fillStyle = INK; g.fillRect(-w / 2, -h / 2, w, h); g.strokeStyle = col; g.lineWidth = 6; g.strokeRect(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16); g.lineWidth = 3; g.strokeRect(-w / 2 + 18, -h / 2 + 18, w - 36, h - 36); g.fillStyle = col; }
  g.textAlign = 'center'; g.fillText(txt, 0, size * 0.36); g.restore();
  if (t - t0 < 0.4) { const k = (t - t0) / 0.4; g.save(); g.globalAlpha = 1 - k; g.strokeStyle = col; g.lineWidth = 6; g.beginPath(); g.ellipse(cx, cy, 200 + k * 260, 90 + k * 120, 0, 0, 7); g.stroke(); g.restore(); } }
function tick(x, y, a, col = GREEN) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(x, y); const s = back(a); g.scale(s, s); g.fillStyle = col; g.beginPath(); g.arc(0, 0, 36, 0, 7); g.fill();
  g.strokeStyle = INK; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-16, 1); g.lineTo(-4, 14); g.lineTo(18, -12); g.stroke(); g.restore(); }
function virus(cx, cy, r, kind, t, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.rotate(t * 0.3);
  const n = kind ? 14 : 10; g.strokeStyle = kind ? HOT : ACC; g.lineWidth = 8; g.lineCap = 'round';
  for (let i = 0; i < n; i++) { const an = i * 2 * Math.PI / n, r2 = r * (kind ? 1.42 : 1.32); g.beginPath(); g.moveTo(Math.cos(an) * r, Math.sin(an) * r); g.lineTo(Math.cos(an) * r2, Math.sin(an) * r2); g.stroke();
    g.fillStyle = kind ? HOT : ACC; g.beginPath(); if (kind) { g.moveTo(Math.cos(an) * r2 + Math.cos(an + 1.57) * 14, Math.sin(an) * r2 + Math.sin(an + 1.57) * 14); g.lineTo(Math.cos(an) * (r2 + 22), Math.sin(an) * (r2 + 22)); g.lineTo(Math.cos(an) * r2 - Math.cos(an + 1.57) * 14, Math.sin(an) * r2 - Math.sin(an + 1.57) * 14); g.fill(); } else { g.arc(Math.cos(an) * r2, Math.sin(an) * r2, 14, 0, 7); g.fill(); } }
  g.fillStyle = INK3; g.strokeStyle = kind ? HOT : ACC; g.lineWidth = 6; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.stroke(); g.restore(); }
function shield(cx, cy, s, a, fill = ACC) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.scale(s, s); g.beginPath(); g.moveTo(0, -90); g.lineTo(75, -60); g.quadraticCurveTo(75, 40, 0, 95); g.quadraticCurveTo(-75, 40, -75, -60); g.closePath();
  g.fillStyle = fill; g.fill(); g.strokeStyle = PAPER; g.lineWidth = 6; g.stroke(); g.restore(); }

// ---------- tarja (lower third) ----------
const STRAP = [[0.9, 'ALERTA', 'COVID VOLTA A SUBIR NO BRASIL'], [12.5, 'ALERTA', 'CASOS GRAVES EM ALTA'], [24.0, 'ENTENDA', 'POR QUE TOMAR O REFORÇO'],
  [35.1, 'ENTENDA', 'O QUE A VACINA FAZ'], [45.2, 'CALENDÁRIO', 'QUEM PRECISA DO REFORÇO'], [56.7, 'SERVIÇO', 'VACINA DE GRAÇA NO SUS']];
const SOURCES = [[0.9, 'FONTE: MINISTÉRIO DA SAÚDE'], [12.5, 'FONTE: FIOCRUZ · INFOGRIPE'], [24.0, 'FONTE: ESTUDOS DE EFETIVIDADE'], [35.1, 'FONTE: MINISTÉRIO DA SAÚDE'], [45.2, 'FONTE: CALENDÁRIO 2026 · FIOCRUZ'], [56.7, 'FONTE: MINISTÉRIO DA SAÚDE']];
const SX = 50, SY = 1482, SW = 760, SH = 118, TY = 1430;
function strap(t) { const inA = ss(0.9, 1.2, t), out = ss(63.5, 63.9, t); if (inA <= 0 || out >= 1) return; const dx = lerp(-1100, 0, back(inA)) - out * 1150;
  let k = 0; STRAP.forEach((r, i) => { if (t >= r[0]) k = i; }); const [t0, tab, txt] = STRAP[k], prev = k > 0 ? STRAP[k - 1] : null, u = k > 0 ? ss(t0, t0 + 0.32, t) : 1;
  g.save(); g.translate(dx, 0);
  // aba
  g.font = `800 34px ${COND}`; const tw = g.measureText(tab).width + 40, flash = prev && prev[1] !== tab ? 1 - ss(t0, t0 + 0.25, t) : 0;
  g.fillStyle = tab === 'ALERTA' ? HOT : ACC; g.fillRect(SX, TY, tw, 52); if (flash > 0) { g.globalAlpha = flash; g.fillStyle = '#fff'; g.fillRect(SX, TY, tw, 52); g.globalAlpha = 1; }
  g.fillStyle = INK; g.textAlign = 'left'; g.fillText(tab, SX + 20, TY + 39);
  // faixa de papel + bloco escuro
  g.fillStyle = PAPER; g.fillRect(SX, SY, SW, SH); g.fillStyle = INK; g.fillRect(SX + SW, SY, 90, SH); g.fillStyle = ACC; g.fillRect(SX + SW + 16, SY + 30, 58, 58);
  g.fillStyle = INK; g.font = `800 34px ${COND}`; g.textAlign = 'center'; g.fillText('F', SX + SW + 45, SY + 72);
  g.save(); g.beginPath(); g.rect(SX, SY, SW, SH); g.clip(); g.textAlign = 'left'; g.fillStyle = INK;
  const put = (s, y) => { g.font = `800 64px ${COND}`; const w = g.measureText(s).width; if (w > SW - 50) g.font = `800 ${64 * (SW - 50) / w}px ${COND}`; g.fillText(s, SX + 24, y); };
  if (prev && u < 1) { put(prev[2], SY + 82 - u * SH); put(txt, SY + 82 + (1 - u) * SH); } else put(txt, SY + 82);
  g.restore(); g.restore();
  let s = ''; SOURCES.forEach(r => { if (t >= r[0]) s = r[1]; }); text(s, SX, 1408, 30, GOLD, 'left', 0.85 * inA * (1 - out), MONO, 700, 820); }

// ---------- vinheta + gancho (0–7,3) ----------
function sting(t) { const sl = [0.04, 0.1]; sl.forEach((t0, i) => { const u = ss(t0, t0 + 0.25, t) * (1 - ss(0.5, 0.7, t)); if (u <= 0) return; g.save(); g.globalAlpha = u; g.fillStyle = i ? GOLD : ACC; g.translate(540, 700); g.rotate(-0.5); g.fillRect(-700 + u * 0, -30 + i * 80, 1400 * u, 26); g.restore(); });
  const sl2 = cl((t - 0.05) / 0.2), fly = ss(0.55, 0.9, t), s = lerp(lerp(0.2, 1.25, back(sl2)), 0.33, fly), cx = lerp(540, 905, fly), cy = lerp(720, 130, fly);
  const shake = t > 0.2 && t < 0.45 ? Math.sin(t * 90) * 8 * (0.45 - t) / 0.25 : 0; if (t >= 0.05) plate(cx + shake, cy, s, 1, cl((t - 0.28) / 0.3));
  if (t > 0.2 && t < 0.6) { const k = (t - 0.2) / 0.4; g.save(); g.globalAlpha = 1 - k; g.strokeStyle = ACC; g.lineWidth = 8; g.beginPath(); g.ellipse(540, 720, 300 + k * 300, 120 + k * 120, 0, 0, 7); g.stroke(); g.restore(); } }
function hook(t) {
  if (t < 0.9) sting(t); else bug(1);
  eyebrow('16 NOV 2026 · BRASIL', 300, ss(0.9, 1.2, t));
  text('COVID', 80, 440, 150, PAPER, 'left', ss(0.05, 0.25, t), COND, 800); text('SUBINDO DE NOVO', 80, 540, 84, ACC, 'left', ss(0.15, 0.35, t), COND, 800);
  // carteirinha
  const a = ss(1.6, 2.0, t), y = lerp(1300, 640, back(ss(1.6, 2.1, t))); if (a > 0) { g.save(); g.globalAlpha = a; g.translate(540, y + 260); g.rotate(lerp(0.15, -0.03, ss(1.6, 2.1, t)));
    g.fillStyle = PAPER; g.fillRect(-400, -230, 800, 460); g.fillStyle = INK; g.fillRect(-400, -230, 800, 80); text('CARTEIRA DE VACINAÇÃO', -370, -175, 44, PAPER, 'left', 1, COND, 800);
    text('COVID-19', -370, -90, 46, INK, 'left', 1, COND, 800); g.fillStyle = 'rgba(0,0,0,0.12)'; [0, 1, 2].forEach(i => g.fillRect(-370, -55 + i * 46, 740, 4));
    text('DATA', -370, 10, 36, OLIVE, 'left', 1, MONO, 700); text('PROTEÇÃO', -370, 120, 36, OLIVE, 'left', 1, MONO, 700);
    g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(-100, 85, 460, 46); const lvl = lerp(1, 0.18, ss(6.0, 6.9, t)); g.fillStyle = lvl > 0.5 ? GREEN : HOT; g.fillRect(-100, 85, 460 * lvl, 46);
    g.restore(); tick(540 + 330, y + 260 - 10, ss(4.6, 4.9, t)); }
  stamp('VENCIDA?', 700, 1160, 3.6, t, HOT, 80);
  text('NÃO NA DATA', 80, 1330, 60, GREEN, 'left', ss(4.6, 4.8, t) * (1 - ss(5.8, 5.95, t)), COND, 800);
  text('NA PROTEÇÃO', 80, 1330, 72, HOT, 'left', ss(5.95, 6.1, t), COND, 800); }

// ---------- gráfico esquemático (7,3–12,5) ----------
const GX0 = 120, GX1 = 960, GY0 = 1150, GY1 = 520, WEEKS = 12;
const val = w => w < 6 ? 0.18 + 0.03 * Math.sin(w * 1.7) : 0.18 + (w - 5) * 0.1;
function chart(t) { bug(1); cornerTag('ESQUEMA · SEM ESCALA', ss(7.4, 7.7, t)); eyebrow('MINISTÉRIO DA SAÚDE · NOV 2026', 230, ss(7.4, 7.7, t));
  text('CASOS DE COVID', 80, 330, 70, PAPER, 'left', ss(7.4, 7.7, t), COND, 800);
  g.save(); g.globalAlpha = ss(7.4, 7.7, t); g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 3; g.beginPath(); g.moveTo(GX0, GY1 - 20); g.lineTo(GX0, GY0); g.lineTo(GX1 + 20, GY0); g.stroke(); g.restore();
  text('SEMANAS', GX1, GY0 + 54, 32, GOLD, 'right', ss(7.4, 7.7, t), MONO);
  const steps = cl((t - 7.6) / 0.22, 0, WEEKS - 1), px = w => lerp(GX0 + 20, GX1, w / (WEEKS - 1)), py = w => lerp(GY0, GY1, val(w));
  const tx = px(5.5), dl = ss(9.0, 9.3, t); if (dl > 0) { g.save(); g.globalAlpha = dl; g.setLineDash([16, 12]); g.strokeStyle = GOLD; g.lineWidth = 4; g.beginPath(); g.moveTo(tx, GY0); g.lineTo(tx, GY1 - 40); g.stroke(); g.restore(); text('6 SEMANAS EM ALTA →', tx + 14, GY1 - 50, 34, GOLD, 'left', dl, MONO, 700); }
  g.save(); g.lineWidth = 9; g.lineJoin = 'round'; g.lineCap = 'round'; for (let w = 1; w <= Math.floor(steps) + 1 && w < WEEKS; w++) { const f = cl(steps - (w - 1)); if (f <= 0) break; g.strokeStyle = w > 5 ? ACC : PAPER;
    g.beginPath(); g.moveTo(px(w - 1), py(w - 1)); g.lineTo(lerp(px(w - 1), px(w), f), lerp(py(w - 1), py(w), f)); g.stroke(); } g.restore();
  const hw = Math.min(steps, WEEKS - 1), hx = lerp(px(Math.floor(hw)), px(Math.min(WEEKS - 1, Math.floor(hw) + 1)), hw % 1), hy = lerp(py(Math.floor(hw)), py(Math.min(WEEKS - 1, Math.floor(hw) + 1)), hw % 1);
  if (t > 7.6) { g.fillStyle = hw > 5 ? ACC : PAPER; g.beginPath(); g.arc(hx, hy, 14, 0, 7); g.fill(); }
  const ro = ss(10.6, 10.9, t); if (ro > 0) { card(80, lerp(1400, 1220, back(ro)), 920, 150, ro); text('6 SEMANAS SEGUIDAS', 110, lerp(1400, 1220, back(ro)) + 72, 56, ACC, 'left', ro, COND, 800); text('DE ALTA NOS CASOS', 110, lerp(1400, 1220, back(ro)) + 124, 36, PAPER, 'left', ro, COND, 700); } }

// ---------- mapa em quadradinhos (12,5–24) ----------
const UF = [['RR', 2, 0], ['AP', 4, 0], ['AC', 0, 1], ['AM', 1, 1], ['PA', 3, 1], ['MA', 4, 1], ['CE', 5, 1], ['RN', 6, 1], ['RO', 1, 2], ['MT', 2, 2], ['TO', 3, 2], ['PI', 4, 2], ['PE', 5, 2], ['PB', 6, 2],
  ['MS', 2, 3], ['GO', 3, 3], ['DF', 4, 3], ['BA', 5, 3], ['AL', 6, 3], ['SP', 3, 4], ['MG', 4, 4], ['ES', 5, 4], ['SE', 6, 4], ['PR', 3, 5], ['RJ', 5, 5], ['SC', 3, 6], ['RS', 3, 7]];
const LIT = { SP: 15.0, RJ: 15.87, MG: 16.5, PR: 17.13, BA: 17.87, DF: 18.67 };
function map(t) { bug(1); cornerTag('MAPA ESQUEMÁTICO', ss(12.6, 12.9, t)); eyebrow('FIOCRUZ · INFOGRIPE · 12 NOV 2026', 230, ss(12.6, 12.9, t));
  text('CASOS GRAVES EM ALTA', 80, 330, 70, PAPER, 'left', ss(12.6, 12.9, t), COND, 800);
  const S = 112, X0 = 150, Y0 = 410; UF.forEach(([n, c, r], i) => { const a = ss(12.6 + i * 0.02, 12.9 + i * 0.02, t), lt = LIT[n] ? ss(LIT[n], LIT[n] + 0.15, t) : 0, x = X0 + c * S, y = Y0 + r * S;
    if (a <= 0) return; g.save(); g.globalAlpha = a; g.fillStyle = lt > 0.5 ? ACC : INK3; g.fillRect(x, y, S - 10, S - 10);
    if (lt > 0 && lt < 1) { g.globalAlpha = 1 - lt; g.strokeStyle = ACC; g.lineWidth = 6; g.strokeRect(x - lt * 20, y - lt * 20, S - 10 + lt * 40, S - 10 + lt * 40); }
    g.restore(); text(n, x + (S - 10) / 2, y + 66, 38, lt > 0.5 ? INK : 'rgba(244,241,232,0.55)', 'center', a, COND, 800); });
  stamp('AINDA EM NÍVEL BAIXO', 540, 1270, 20.1, t, GOLD, 58, -0.08);
  const up = ss(22.0, 22.3, t); if (up > 0) { text('TENDÊNCIA', 120, 1010, 50, ACC, 'left', up, COND, 800); text('DE ALTA ↑', 120, 1068, 58, ACC, 'left', up, COND, 800); } }

// ---------- proteção cai e o vírus muda (24–35,1) ----------
function wane(t) { bug(1);
  if (t < 29.0) { cornerTag('ESQUEMA · SEM ESCALA', ss(24.1, 24.4, t)); eyebrow('DEPOIS DA VACINA', 230, ss(24.1, 24.4, t)); text('A PROTEÇÃO CAI', 80, 330, 76, PAPER, 'left', ss(24.1, 24.4, t), COND, 800);
    const a = ss(24.2, 24.5, t); g.save(); g.globalAlpha = a; g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 3; g.beginPath(); g.moveTo(GX0, GY1 - 20); g.lineTo(GX0, GY0); g.lineTo(GX1 + 20, GY0); g.stroke(); g.restore();
    for (let m = 0; m <= 12; m += 3) text(String(m), lerp(GX0 + 20, GX1, m / 12), GY0 + 50, 30, GOLD, 'center', a, MONO, 700); text('MESES', GX1, GY0 + 100, 32, GOLD, 'right', a, MONO, 700);
    const p = ss(25.7, 28.4, t), N = 60; g.save(); g.lineWidth = 9; g.strokeStyle = ACC; g.lineCap = 'round'; g.beginPath();
    for (let i = 0; i <= N * p; i++) { const u = i / N, x = lerp(GX0 + 20, GX1, u), y = lerp(GY0, GY1, 0.92 * Math.exp(-u * 1.7) + 0.06); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.restore();
    shield(GX0 + 120, GY1 + 30, 0.6, a * (1 - 0.6 * p)); text('VACINA', GX0 + 20, GY1 - 60, 34, GOLD, 'left', a, MONO, 700);
  } else {
    eyebrow('E O VÍRUS TAMBÉM MUDA', 230, 1); text('O VÍRUS MUDA', 80, 330, 76, PAPER, 'left', 1, COND, 800);
    const a1 = ss(29.0, 29.3, t), a2 = ss(29.9, 30.2, t); card(70, 450, 450, 650, a1); card(560, 450, 450, 650, a2);
    text('ANTES', 295, 520, 40, GOLD, 'center', a1, MONO, 700); text('HOJE', 785, 520, 40, GOLD, 'center', a2, MONO, 700);
    virus(295, 740, 100, 0, t, a1); virus(785, 740, 100, 1, t, a2);
