<body><canvas id="c" width="1080" height="1920"></canvas><script src="fala.js"></script><script>
// "Dengue × El Niño" — estilo Whiteboard Explainer (lemo-opuscar, styles/whiteboard/STYLE.md), vertical 1080×1920.
// Um quadro branco só; a câmera viaja entre as regiões, cada ideia é desenhada no tempo da fala (fala.json).
// Marcadores flutuando sem mão, tinta em multiply com falhas de marcador seco. Cores: preto (tudo), azul (só água), vermelho (destaque).
// Roteiro e fontes: roteiros/dengue_el_nino.md.
const W = 1080, H = 1920;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const INKC = '#23262c', BLUE = '#2a5cb3', RED = '#c8363a';
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, u) => a + (b - a) * u;
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const hand = u => u - Math.sin(2 * Math.PI * u) / (2 * Math.PI) * 0.8;   // devagar-rápido-devagar
const smooth = u => u * u * (3 - 2 * u);

// ---------- quadro ----------
const BOARD = (() => {
  const c = document.createElement('canvas'); c.width = 1300; c.height = 1700; const x = c.getContext('2d');
    x.globalAlpha = 0.06; x.strokeStyle = '#7d8aa0'; x.lineWidth = 6; x.lineCap = 'round';
  for (let i = 0; i < 18; i++) { x.beginPath(); const px = hash(i, 1) * 1300, py = hash(i, 2) * 1700; if (i % 3) x.arc(px, py, 30 + hash(i, 3) * 90, 0, 4 + hash(i, 4) * 2); else { x.moveTo(px, py); x.lineTo(px + 120 + hash(i, 5) * 200, py + (hash(i, 6) - 0.5) * 60); } x.stroke(); }
  x.globalAlpha = 0.05; x.strokeStyle = '#000'; x.lineWidth = 1;
  for (let i = 0; i < 420; i++) { const px = hash(i, 11) * 1300, py = hash(i, 12) * 1700; x.beginPath(); x.moveTo(px, py); x.lineTo(px + (hash(i, 13) - 0.5) * 40, py + (hash(i, 14) - 0.5) * 8); x.stroke(); }
  return c;
})();
const DRY = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 256; const x = c.getContext('2d'); for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(0,0,0,${0.2 + hash(i, 1) * 0.6})`; x.fillRect(hash(i, 2) * 256, hash(i, 3) * 256, 1 + hash(i, 4) * 6, 1); } return c; })();

// ---------- regiões do quadro (a câmera vai de uma para outra) ----------
const RW = 1300, RH = 1700;
const RO = i => { const row = Math.floor(i / 4); let col = i % 4; if (row % 2) col = 3 - col; return [col * RW, row * RH]; };
let OX = 0, OY = 0;
const reg = i => { [OX, OY] = RO(i); };
// início de cada cena (s) e a região dela
const SC = [[0, 0], [4.2, 1], [8.07, 2], [12.17, 3], [15.9, 4], [18.77, 5], [21.87, 6], [27.67, 7], [30.7, 8], [40.23, 9], [48.57, 10], [55.67, 11], [59.43, 12], [63.9, 13], [67.37, 14], [69.33, 15], [74.1, 16]];
const END = 77.2;
function cam(t) {
  let i = 0; for (let k = 0; k < SC.length; k++) if (SC[k][0] - 0.35 <= t) i = k;
  const [b0x, b0y] = RO(SC[Math.max(0, i - 1)][1]), [b1x, b1y] = RO(SC[i][1]);
  const u = i === 0 ? 1 : smooth(cl((t - (SC[i][0] - 0.35)) / 0.7));
  return [lerp(b0x, b1x, u), lerp(b0y, b1y, u), u];
}

// ---------- traços e escrita ----------
function resample(pts, step = 5) { const o = [pts[0]]; for (let i = 1; i < pts.length; i++) { const [a, b] = [pts[i - 1], pts[i]], n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step)); for (let k = 1; k <= n; k++) o.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]); } return o; }
function wob(pts, seed) { return pts.map((p, i) => { const w = Math.sin(i * 0.05 + seed) * 2.2 + Math.sin(i * 0.31 + seed * 3) * 0.7; return [p[0] + w, p[1] + w * 0.6]; }); }
const S = [], TX = [];
function stroke(t0, dur, pts, color = INKC, w = 9, clip = null) {
  const r = wob(resample(pts.map(p => [p[0] + OX, p[1] + OY])), S.length * 1.7);
  S.push({ t0, dur, pts: r, color, w, clip: clip && clip.map(p => [p[0] + OX, p[1] + OY]) });
}
function write(t0, dur, s, x, y, size, color = INKC, align = 'center') {
  g.font = `700 ${size}px Caveat`; const ww = g.measureText(s).width;
  const x0 = (align === 'center' ? x - ww / 2 : x) + OX;
  TX.push({ t0, dur, s, x: x0, y: y + OY, size, color, ww, rot: (hash(TX.length, 7) - 0.5) * 0.03 });
}
const ell = (cx, cy, rx, ry, a0 = -2.2, over = 0.35, n = 60) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (Math.PI * 2 + over) * i / n; return [cx + Math.cos(a) * rx * (1 + 0.03 * Math.sin(a * 3)), cy + Math.sin(a) * ry]; });
const rectP = (x, y, w, h) => [[x, y], [x + w + 4, y], [x + w, y + h + 3], [x - 3, y + h], [x, y - 4]];
function hatch(t0, dur, poly, color, step = 22, w = 6) {
  const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), span = (x1 - x0) + (y1 - y0);
  const n = Math.ceil(span / step);
  for (let i = 0; i < n; i++) { const d = i * step; stroke(t0 + dur * i / n, Math.max(0.05, dur / n * 1.6), [[x0 + d - (y1 - y0), y1], [x0 + d, y0]], color, w, poly); }
}
// desenhos simples
function sun(t0, cx, cy, r, color = INKC, dur = 0.7) {
  stroke(t0, dur * 0.45, ell(cx, cy, r, r, -2.0, 0.4, 40), color, 8);
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; stroke(t0 + dur * 0.45 + i * dur * 0.06, dur * 0.06, [[cx + Math.cos(a) * r * 1.35, cy + Math.sin(a) * r * 1.35], [cx + Math.cos(a) * r * 1.85, cy + Math.sin(a) * r * 1.85]], color, 7); }
}
function cloud(t0, cx, cy, s, rain = true) {
  const pts = []; const bumps = [[-1.1, 0.15, 0.42], [-0.55, -0.35, 0.55], [0.2, -0.45, 0.6], [0.85, -0.1, 0.45], [1.15, 0.25, 0.3]];
  bumps.forEach(([bx, by, br], k) => { for (let i = 0; i <= 10; i++) { const a = Math.PI * (1.05 - i / 10 * 1.1) + (k === 0 ? -0.6 : 0); pts.push([cx + (bx + Math.cos(a) * br) * 100 * s, cy + (by - Math.sin(a) * br) * 100 * s]); } });
  pts.push([cx + 1.2 * 100 * s, cy + 0.42 * 100 * s], [cx - 1.3 * 100 * s, cy + 0.42 * 100 * s], pts[0]);
  stroke(t0, 0.5, pts, INKC, 8);
  if (rain) for (let i = 0; i < 6; i++) { const x = cx + (-1.0 + i * 0.4) * 100 * s; stroke(t0 + 0.5 + i * 0.05, 0.08, [[x, cy + 70 * s], [x - 14 * s, cy + 120 * s]], BLUE, 7); }
}
function mosquito(t0, cx, cy, s, step = 0.07) {
  let t = t0; const nx = d => (t += d, t - d);
  stroke(nx(step * 3), step * 3, ell(cx + 70 * s, cy + 12 * s, 85 * s, 26 * s, 3.2, 0.3, 40).map(([x, y]) => [x, y + (x - cx) * 0.15]), INKC, 8);
  for (let k = 0; k < 4; k++) { const x = cx + (30 + k * 32) * s; stroke(nx(step * 0.6), step * 0.6, [[x, cy - 10 * s + (x - cx) * 0.15], [x - 6 * s, cy + 36 * s + (x - cx) * 0.15]], INKC, 8); }
  stroke(nx(step * 2), step * 2, ell(cx - 15 * s, cy, 36 * s, 32 * s, -1, 0.3, 30), INKC, 8);
  stroke(nx(step * 1.5), step * 1.5, ell(cx - 72 * s, cy - 6 * s, 22 * s, 22 * s, 0, 0.3, 24), INKC, 8);
  stroke(nx(step), step, [[cx - 92 * s, cy], [cx - 170 * s, cy + 34 * s]], INKC, 7);
  stroke(nx(step * 2), step * 2, ell(cx + 10 * s, cy - 85 * s, 26 * s, 70 * s, 1.6, 0.25, 30).map(([x, y]) => [x + (cy - y) * 0.35, y]), INKC, 6);
  stroke(nx(step * 2), step * 2, ell(cx + 50 * s, cy - 70 * s, 22 * s, 58 * s, 1.6, 0.25, 30).map(([x, y]) => [x + (cy - y) * 0.6, y]), INKC, 6);
  for (let i = 0; i < 6; i++) { const lx = cx + (-40 + i * 18) * s; stroke(nx(step * 0.7), step * 0.7, [[lx, cy + 25 * s], [lx - 20 * s + i * 7 * s, cy + 75 * s], [lx - 34 * s + i * 14 * s, cy + 135 * s]], INKC, 6); }
  return t;
}
function thermo(t0, cx, top, h, fill0, fill1, fillT) {
  stroke(t0, 0.35, [[cx - 22, top + h], [cx - 22, top + 18], [cx - 16, top + 2], [cx, top - 4], [cx + 16, top + 2], [cx + 22, top + 18], [cx + 22, top + h]], INKC, 8);
  stroke(t0 + 0.35, 0.25, ell(cx, top + h + 40, 46, 46, -1.0, 0.0, 30).slice(0, 26), INKC, 8);
  stroke(fillT, 0.2, ell(cx, top + h + 40, 28, 28, 0, 0.5, 20), RED, 22);
  stroke(fillT + 0.15, 1.0, [[cx, top + h + 20], [cx, top + h - (h - 20) * fill0], [cx, top + h - (h - 20) * fill1]], RED, 16);
}

// ---------- a aula, cena por cena (tempos tirados da narração) ----------

  reg(14);
  stroke(67.45, 0.5, [[300, 700], [780, 560], [420, 820], [300, 700], [520, 740], [420, 820]], INKC, 8);
  for (let i = 0; i < 6; i++) stroke(67.95 + i * 0.07, 0.06, [[260 - i * 40, 740 + i * 30], [235 - i * 40, 752 + i * 30]], INKC, 6);
  write(67.5, 0.5, 'manda!', 540, 1060, 170, RED);
  // 17 — me siga (o logo preso por um ímã)
  reg(15);
  write(70.0, 0.6, 'me siga', 540, 1040, 160);
  write(71.0, 1.2, 'farmacologia e curiosidades', 540, 1180, 72);
  // 18 — tela final
  reg(16);
  write(74.3, 0.6, 'Consulte um', 540, 640, 120);
  write(74.9, 0.9, 'profissional de saúde', 540, 800, 110, RED);
  write(75.8, 0.7, 'para orientações.', 540, 960, 110);
  // capa (região 17)
  reg(17);
  write(-9, 0.1, 'dengue', 540, 640, 260, RED);
  write(-9, 0.1, '+ El Niño', 540, 830, 170);
  mosquito(-9, 560, 1110, 1.5, 0.01);
  write(-9, 0.1, '21/11 · Dia Nacional', 540, 1420, 80);
  stroke(-9, 0.1, [[230, 870], [540, 885], [850, 866]], RED, 10);
}

// ---------- legenda (palavras da narração, números em algarismos) ----------
let FRASES = [];
async function legendas() {
  const fala = window.FALA;
  if (!fala) return;
  const NUM = [[['vinte', 'e', 'um', 'de', 'novembro'], '21 de novembro'], [['dois', 'mil', 'e', 'vinte', 'e', 'seis'], '2026'], [['dois', 'mil', 'e', 'vinte', 'e', 'três'], '2023'], [['dois', 'mil', 'e', 'quinze'], '2015'], [['setenta', 'por', 'cento'], '70%'], [['vinte', 'por', 'cento'], '20%']];
  const nw = w => w.toLowerCase().replace(/[.,:;!?]/g, '');
  const W2 = [];
  for (let i = 0; i < fala.length; i++) {
    const m = NUM.find(([ws]) => ws.every((x, j) => fala[i + j] && nw(fala[i + j].w) === x));
    if (m) { const last = fala[i + m[0].length - 1].w; W2.push({ w: m[1] + ((last.match(/[.,:;!?]$/) || [''])[0]), f: fala[i].f }); i += m[0].length - 1; } else W2.push(fala[i]);
  }
  let cur = [];
  W2.forEach((w, i) => { cur.push(w); if (/[.?!:]$/.test(w.w) || (/,$/.test(w.w) && cur.length >= 4) || i === W2.length - 1) { if (cur.length > 8) { const m = Math.ceil(cur.length / 2); FRASES.push(cur.slice(0, m)); FRASES.push(cur.slice(m)); } else FRASES.push(cur); cur = []; } });
  FRASES = FRASES.map(ws => ({ t0: ws[0].f / 30, t1: ws[ws.length - 1].f / 30 + 0.5, s: ws.map(w => w.w).join(' ') }));
  FRASES.forEach((f, i) => { const nx = FRASES[i + 1]; f.t1 = nx ? Math.max(f.t1, Math.min(nx.t0, f.t0 + 1.8)) : f.t1 + 0.6; });
}
function legenda(t) {
  if (t > SC[SC.length - 1][0] - 0.1) return;
  const f = FRASES.find(x => t >= x.t0 - 0.05 && t < x.t1); if (!f) return;
  g.save(); g.font = '700 64px Caveat';
  const words = f.s.split(' '); const lines = []; let l = '';
  words.forEach(w => { const tt = l ? l + ' ' + w : w; if (g.measureText(tt).width > 820 && l) { lines.push(l); l = w; } else l = tt; }); lines.push(l);
  const bw = Math.max(...lines.map(x => g.measureText(x).width)) + 90, bh = lines.length * 72 + 40, by = 1420;
  const a = cl((t - f.t0 + 0.05) / 0.12);
  g.globalAlpha = 0.9 * a; g.fillStyle = '#fbfaf3'; g.beginPath(); g.roundRect(540 - bw / 2, by, bw, bh, 26); g.fill();
  g.globalAlpha = a; g.strokeStyle = RED; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(540 - bw / 2 + 26, by + bh - 14); g.lineTo(540 - bw / 2 + 70, by + bh - 16); g.stroke();
  g.fillStyle = INKC; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((x, i) => g.fillText(x, 540, by + 40 + i * 72));
  g.restore();
}

// ---------- marcador flutuante (sem mão) ----------
let ITEMS = [];
function prep() {
  ITEMS = [...S.map(s => ({ t0: s.t0, t1: s.t0 + s.dur, a: s.pts[0], b: s.pts[s.pts.length - 1], c: s.color, s })), ...TX.map(w => ({ t0: w.t0, t1: w.t0 + w.dur, a: [w.x, w.y - w.size * 0.3], b: [w.x + w.ww, w.y - w.size * 0.3], c: w.color, w }))].filter(i => i.t0 >= 0).sort((p, q) => p.t0 - q.t0);
}
function tipOf(it, t) {
  const u = cl((t - it.t0) / (it.t1 - it.t0));
  if (it.s) { const n = it.s.pts.length - 1; return it.s.pts[Math.floor(hand(u) * n)]; }
  const w = it.w; return [w.x + w.ww * u, w.y - w.size * 0.3 + Math.sin(u * 50) * w.size * 0.12];
}
function penAt(t, cx, cy) {
  const park = [1260 + cx, 1300 + cy];
  let act = null, prev = null, next = null;
  for (const it of ITEMS) { if (it.t0 <= t && t <= it.t1) act = it; if (it.t1 < t && (!prev || it.t1 > prev.t1)) prev = it; if (it.t0 > t && !next) next = it; }
  if (act) return { p: tipOf(act, t), c: act.c, lift: 0 };
  if (!prev && !next) return { p: park, c: INKC, lift: 1 };
  const from = prev ? prev.b : park, to = next ? next.a : park, t0 = prev ? prev.t1 : t - 1, t1 = next ? next.t0 : t + 1, gap = t1 - t0;
  if (gap < 1.2) { const u = smooth(cl((t - t0) / gap)); return { p: [lerp(from[0], to[0], u), lerp(from[1], to[1], u) - Math.sin(u * Math.PI) * 40], c: (next || prev).c, lift: Math.sin(u * Math.PI) }; }
  if (t - t0 < 0.45) { const u = smooth((t - t0) / 0.45); return { p: [lerp(from[0], park[0], u), lerp(from[1], park[1], u)], c: prev.c, lift: u }; }
  if (t1 - t < 0.45) { const u = smooth(1 - (t1 - t) / 0.45); return { p: [lerp(park[0], to[0], u), lerp(park[1], to[1], u)], c: next.c, lift: 1 - u }; }
  return { p: park, c: (next || prev).c, lift: 1 };
}
function marker(x, y, c, lift) {
  g.save(); g.translate(x + 18 + lift * 30, y + 26 + lift * 40); g.rotate(-0.75); g.globalAlpha = 0.18; g.filter = `blur(${6 + lift * 10}px)`; g.fillStyle = '#000'; g.fillRect(0, -16, 230, 32); g.restore();
  g.save(); g.translate(x, y); g.rotate(-0.75);
  g.fillStyle = '#f7f7f5'; g.fillRect(14, -17, 190, 34); g.strokeStyle = '#c9c9c4'; g.lineWidth = 2; g.strokeRect(14, -17, 190, 34);
  g.fillStyle = c; g.fillRect(150, -17, 18, 34); g.fillRect(204, -15, 40, 30);
  g.beginPath(); g.moveTo(0, -5); g.lineTo(14, -12); g.lineTo(14, 12); g.lineTo(0, 5); g.closePath(); g.fill();
  g.restore();
}

// ---------- tinta ----------
const INK = document.createElement('canvas'); INK.width = W; INK.height = H; const k = INK.getContext('2d');
function inkLayer(t, cx, cy, all = false) {
  k.setTransform(1, 0, 0, 1, 0, 0); k.clearRect(0, 0, W, H); k.translate(-cx, -cy); k.lineCap = 'round'; k.lineJoin = 'round';
  const vis = (pts) => pts.some(p => p[0] > cx - 300 && p[0] < cx + W + 300 && p[1] > cy - 300 && p[1] < cy + H + 300);
  for (const s of S) {
    const u = all ? 1 : cl((t - s.t0) / s.dur); if (u <= 0 || !vis([s.pts[0], s.pts[s.pts.length - 1]])) continue;
    const n = Math.max(2, Math.ceil(s.pts.length * hand(u)));
    k.save();
    if (s.clip) { k.beginPath(); s.clip.forEach((p, i) => i ? k.lineTo(p[0], p[1]) : k.moveTo(p[0], p[1])); k.closePath(); k.clip(); }
    k.strokeStyle = s.color; k.globalAlpha = 0.94;
    for (let i = 1; i < n; i++) { k.lineWidth = s.w * (i < 4 ? 1.25 : (i > s.pts.length - 4 ? 0.8 : 1)); k.beginPath(); k.moveTo(...s.pts[i - 1]); k.lineTo(...s.pts[i]); k.stroke(); }
    if (!s.clip) { k.globalAlpha = 1; k.fillStyle = s.color; k.beginPath(); k.arc(s.pts[0][0], s.pts[0][1], s.w * 0.7, 0, 7); k.fill(); }
    k.restore();
  }
  for (const w of TX) {
    const u = all ? 1 : cl((t - w.t0) / w.dur); if (u <= 0 || !vis([[w.x, w.y], [w.x + w.ww, w.y]])) continue;
    k.save(); k.font = `700 ${w.size}px Caveat`;
    k.beginPath(); k.rect(w.x - 10, w.y - w.size * 1.1, (w.ww + 20) * u, w.size * 1.5); k.clip();
    k.fillStyle = w.color; k.globalAlpha = 0.94; k.translate(w.x, w.y); k.rotate(w.rot); k.fillText(w.s, 0, 0); k.restore();
  }
  k.setTransform(1, 0, 0, 1, 0, 0);
  k.save(); k.globalCompositeOperation = 'destination-out'; k.globalAlpha = 0.35; k.fillStyle = k.createPattern(DRY, 'repeat'); k.translate(-cx % 256, -cy % 256); k.fillRect(0, 0, W + 512, H + 512); k.restore();
}

// ---------- logo preso por um ímã (Me siga) ----------
const LOGO = new Image(); LOGO.src = 'logo.jpg';
function logo(t, cx, cy) {
  const t0 = 69.55; if (t < t0 || t > SC[SC.length - 1][0] + 0.5) return;
  const [ox, oy] = RO(15), u = cl((t - t0) / 0.35), drop = 1 - smooth(u);
  const x = ox + 540 - cx, y = oy + 600 - cy - drop * 60, r = 230;
  g.save(); g.globalAlpha = 0.18; g.filter = `blur(${8 + drop * 14}px)`; g.fillStyle = '#000'; g.beginPath(); g.arc(x + 14 + drop * 20, y + 20 + drop * 30, r, 0, 7); g.fill(); g.restore();
  g.save(); g.globalAlpha = smooth(u); g.beginPath(); g.arc(x, y, r, 0, 7); g.clip(); g.drawImage(LOGO, x - r, y - r, r * 2, r * 2); g.restore();
  g.save(); g.globalAlpha = smooth(u); g.lineWidth = 8; g.strokeStyle = INKC; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
  const mx = x, my = y - r + 10; g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.arc(mx + 6, my + 9, 34, 0, 7); g.fill();
  g.fillStyle = RED; g.beginPath(); g.arc(mx, my, 34, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.arc(mx - 11, my - 12, 10, 0, 7); g.fill();
  g.restore();
}

function scene(t, cx, cy, opts = {}) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.filter = 'none'; g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const bx = ((cx % RW) + RW) % RW, by = ((cy % RH) + RH) % RH;
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#fbfaf6'); bg.addColorStop(1, '#eeede8'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 2; j++) g.drawImage(BOARD, i * RW - bx, j * RH - by);
  logo(t, cx, cy);
  inkLayer(t, cx, cy, opts.all); g.globalCompositeOperation = 'multiply'; g.drawImage(INK, 0, 0); g.globalCompositeOperation = 'source-over';
  if (!opts.noPen) { const pen = penAt(t, cx, cy); marker(pen.p[0] - cx, pen.p[1] - cy, pen.c, pen.lift); }
  // brilho da janela, mais lento que o quadro
  const sx = -600 + ((t * 60 - cx * 0.35) % 2400 + 2400) % 2400 - 600;
  g.save(); g.globalAlpha = 0.12; const gr = g.createLinearGradient(sx, 0, sx + 700, 500); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.beginPath(); g.moveTo(sx, 0); g.lineTo(sx + 380, 0); g.lineTo(sx + 1100, H); g.lineTo(sx + 720, H); g.closePath(); g.fill(); g.restore();
  if (!opts.noCaption) legenda(t);
}

window.END = END;
window.draw = function (t) { const [cx, cy] = cam(t); scene(t, cx, cy); };
window.capa = function () { const [cx, cy] = RO(17); scene(999, cx, cy, { all: true, noPen: true, noCaption: true }); };
window.strokes = () => [...S, ...TX].filter(s => s.t0 >= 0).map(s => [s.t0, s.dur, s.color === RED ? 1 : 0]);
Promise.all([document.fonts.load('700 40px Caveat'), legendas(), new Promise(r => { if (LOGO.complete) r(); else LOGO.onload = LOGO.onerror = r; })]).then(() => { build(); prep(); for (let i = 0; i < 3; i++) window.draw(i * 0.01); window.ready = true; });
</script></body></html>
