<script>
// Vídeo "INTERACOES.EXE" (Modelo 2, horizontal 1920x1080): 7 remédios que não combinam. Tudo é desenhado por draw(t), t em segundos da narração.
// Narração feita pela usuária no OpenArt (narracao.mp3). Tempos palavra a palavra em words.js (vindos de mecanismo/src/interacoes2/fala.json).
// Roteiro e fontes: roteiros/remedios_que_nao_combinam.md.
const W = 1920, H = 1080;
const NARR = WORDS[WORDS.length - 1].e;
window.END = NARR + 4;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const G = '#39ff6a', A = '#ffc23d', R = '#ff4d6d', CY = '#3de0ff', BG = '#020c06', WH = '#eafff0', PK = '#ff8ad8';
const SILK = "'Silk'", VT = "'VT'";

// ---------- utilidades ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const k = (t, a, d = 0.35) => cl((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.9; x = cl(x); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, u) => a + (b - a) * u;
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function text(s, x, y, size, { font = VT, color = WH, align = 'left', alpha = 1, glow = 0, bold = false, base = 'alphabetic' } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = `${bold ? 700 : 400} ${size}px ${font}`; g.textAlign = align; g.textBaseline = base;
  if (glow) { g.shadowColor = color; g.shadowBlur = glow; }
  g.fillStyle = color; g.fillText(s, x, y); g.restore();
}
function typed(s, t, at, x, y, size, opt = {}) {
  if (t < at) return;
  const cps = opt.cps || 22;
  const n = Math.min(s.length, Math.floor((t - at) * cps) + 1);
  const shown = s.slice(0, n) + (n < s.length || opt.cursor ? (Math.floor(t * 2.5) % 2 ? '█' : ' ') : '');
  text(shown, x, y, size, opt);
}
function box(x, y, w, h, color, { lit = 0, alpha = 1, fill = 'rgba(2,20,10,0.88)', lw = 4 } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha;
  g.fillStyle = fill; g.fillRect(x, y, w, h);
  g.shadowColor = color; g.shadowBlur = 8 + 30 * lit;
  g.strokeStyle = color; g.lineWidth = lw + 2 * lit; g.strokeRect(x, y, w, h);
  g.shadowBlur = 0;
  g.fillStyle = color; [[x, y], [x + w - 12, y], [x, y + h - 12], [x + w - 12, y + h - 12]].forEach(([a, b]) => g.fillRect(a, b, 12, 12));
  g.restore();
}
function stamp(s, t, at, x, y, color, { rot = -8, size = 64, font = SILK } = {}) {
  if (t < at) return;
  const u = cl((t - at) / 0.22);
  const sc = lerp(2.6, 1, eo(u));
  const shake = u >= 1 ? Math.max(0, 1 - (t - at - 0.22) / 0.25) * 8 * Math.sin((t - at) * 90) : 0;
  g.save(); g.translate(x + shake, y); g.rotate(rot * Math.PI / 180); g.scale(sc, sc); g.globalAlpha *= cl(u * 1.6);
  g.font = `700 ${size}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(s).width + 50, h = size + 34;
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(-w / 2, -h / 2, w, h);
  g.strokeStyle = color; g.lineWidth = 8; g.shadowColor = color; g.shadowBlur = 24; g.strokeRect(-w / 2, -h / 2, w, h);
  g.lineWidth = 3; g.strokeRect(-w / 2 + 12, -h / 2 + 12, w - 24, h - 24);
  g.shadowBlur = 12; g.fillStyle = color; g.fillText(s, 0, 4);
  g.restore();
}
const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x / 6) * 6, Math.round(y / 6) * 6, Math.round(w / 6) * 6, Math.round(h / 6) * 6); };
function chip(s, x, y, t, at, cor, size = 36) {
  if (t < at) return;
  const u = back(k(t, at, 0.3));
  g.save(); g.translate(x, y); g.scale(u, u);
  g.font = `700 ${size}px ${SILK}`; const w = g.measureText(s).width + 50;
  box(-w / 2, -size * 0.95, w, size * 1.9, cor, { lit: 0.5, lw: 3 });
  text(s, 0, size * 0.36, size, { font: SILK, color: cor, bold: true, align: 'center' });
  g.restore();
}
// quebra o texto em linhas que cabem na largura
function linhas(s, size, maxW, font = VT) {
  g.font = `400 ${size}px ${font}`;
  const out = []; let cur = '';
  s.split(' ').forEach(p => { const tent = cur ? cur + ' ' + p : p; if (g.measureText(tent).width > maxW && cur) { out.push(cur); cur = p; } else cur = tent; });
  if (cur) out.push(cur);
  return out;
}

// ---------- fundo ----------
function fundo(t) {
  const rg = g.createRadialGradient(960, 420, 100, 960, 500, 1200);
  rg.addColorStop(0, '#062a14'); rg.addColorStop(1, BG);
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.font = `30px ${VT}`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  for (let c = 0; c < 48; c++) {
    const sp = 30 + rnd(c) * 60, off = rnd(c + 50) * 1400;
    for (let r = 0; r < 10; r++) {
      const y = ((t * sp + off + r * 36) % 1400) - 200;
      const bit = (Math.floor(t * 3 + c * 7 + r * 3) % 3) === 0 ? '1' : '0';
      g.fillStyle = rgba(G, (0.03 + 0.05 * (r / 10)) * (0.6 + 0.4 * rnd(c + r)));
      g.fillText(bit, c * 40 + 6, y);
    }
  }
  const hy = 840, vx = 960;
  g.save(); g.strokeStyle = rgba(G, 0.22); g.lineWidth = 2;
  for (let i = -20; i <= 20; i++) { g.beginPath(); g.moveTo(vx + i * 40, hy); g.lineTo(vx + i * 260, H); g.stroke(); }
  for (let j = 0; j < 10; j++) {
    const u = ((j + (t * 0.6) % 1) / 10);
    const y = hy + Math.pow(u, 2.2) * (H - hy);
    g.globalAlpha = 0.25 + 0.75 * u; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  g.restore();
  const fade = g.createLinearGradient(0, hy - 30, 0, hy + 120);
  fade.addColorStop(0, BG); fade.addColorStop(1, 'rgba(2,12,6,0)');
  g.fillStyle = fade; g.fillRect(0, hy - 30, W, 150);
}
function crt() {
  g.fillStyle = 'rgba(0,0,0,0.16)';
  for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
  const v = g.createRadialGradient(960, 540, 600, 960, 540, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.75)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------- tempos ----------
const norm = w => w.toLowerCase().replace(/[.,!?:;"]/g, '');
// primeira vez que a palavra aparece a partir do segundo "desde"
function T(word, desde = 0) {
  for (const w of WORDS) if (w.s >= desde && norm(w.w) === word) return w.s;
  console.warn('tempo não achado', word, desde); return 1e9;
}
function Tn(word, n) { let c = 0; for (const w of WORDS) if (norm(w.w) === word && ++c === n) return w.s; return 1e9; }

// cada combinação: nome dos dois remédios, cor, carimbo e linhas do terminal (palavra-gatilho, marcador, texto)
const CAPS = [
  { a: 'ANTICONCEPCIONAL', b: 'ANTIBIÓTICO', ca: PK, cb: CY, selo: ['QUASE SEMPRE É MITO', G, 'mito'], itens: [
    ['história', '>', '"antibiótico corta o efeito da pílula?"'],
    ['amoxicilina', 'OK', 'amoxicilina, azitromicina, cefalexina: não cortam'],
    ['rifampicina', '!', 'exceção: rifampicina (tuberculose)'],
    ['fígado', 'i', 'acelera o fígado, que destrói o hormônio'],
    ['quatro', '!', 'use outro método + 4 semanas depois'],
    ['vomitar', '!', 'vômito ou diarreia forte: a pílula pode não ser absorvida'],
  ] },
  { a: 'ANTI-INFLAMATÓRIO', b: 'REMÉDIO DE PRESSÃO', ca: A, cb: CY, selo: ['TRIPLA AMEAÇA', R, 'tripla'], itens: [
    ['ibuprofeno', 'i', 'ibuprofeno, diclofenaco, naproxeno'],
    ['segurar', 'i', 'o corpo segura sal e água'],
    ['atrapalhar', '!', 'atrapalha o remédio de pressão'],
    ['tripla', 'X', 'anti-inflamatório + losartana/enalapril + diurético'],
    ['rins', 'X', 'menos sangue nos rins: lesão renal (1º mês)'],
    ['conta', 'OK', 'nada de anti-inflamatório por conta própria'],
  ] },
  { a: 'OMEPRAZOL', b: 'CLOPIDOGREL', ca: CY, cb: R, selo: ['CUIDADO', A, 'bloqueia'], itens: [
    ['fino', 'i', 'clopidogrel: deixa o sangue mais fino'],
    ['infarto', 'i', 'usado depois de infarto ou stent'],
    ['ativado', 'i', 'precisa ser ativado por uma enzima do fígado'],
    ['bloqueia', 'X', 'o omeprazol bloqueia essa enzima'],
    ['horários', '!', 'separar os horários não resolve'],
    ['pantoprazol', 'OK', 'alternativa comum: pantoprazol'],
  ] },
  { a: 'VARFARINA', b: 'ANTI-INFLAMATÓRIO', ca: R, cb: A, selo: ['RISCO DE SANGRAMENTO', R, 'sangramento'], itens: [
    ['afina', 'i', 'varfarina: afina o sangue'],
    ['irrita', '!', 'anti-inflamatório: mexe na coagulação e irrita o estômago'],
    ['sangramento', 'X', 'muito mais risco de sangramento'],
    ['paracetamol', 'OK', 'dor ou febre: paracetamol'],
    ['menor', '!', 'na menor dose que resolva, por pouco tempo'],
    ['altas', '!', 'doses altas por vários dias também aumentam o efeito'],
  ] },
  { a: 'SINVASTATINA', b: 'CLARITROMICINA', ca: PK, cb: CY, selo: ['NÃO USAR JUNTOS', R, 'proíbe'], itens: [
    ['colesterol', 'i', 'sinvastatina: colesterol'],
    ['trava', 'X', 'a claritromicina trava a enzima do fígado'],
    ['acumula', '!', 'a sinvastatina se acumula no sangue'],
    ['músculos', 'X', 'dor e lesão nos músculos'],
    ['proíbe', '!', 'a bula proíbe: suspender a sinvastatina'],
    ['toranja', '!', 'suco de toranja (grapefruit): evitar'],
  ] },
  { a: 'LEVOTIROXINA', b: 'CÁLCIO · FERRO · ANTIÁCIDO', ca: CY, cb: WH, selo: ['SEPARAR HORÁRIOS', A, 'quatro'], itens: [
    ['tireoide', 'i', 'levotiroxina: hormônio da tireoide'],
    ['grudam', 'X', 'cálcio, ferro e antiácido grudam nela'],
    ['jejum', 'OK', 'em jejum, sozinha, só com água'],
    ['quatro', 'OK', 'suplementos: pelo menos 4 horas de distância'],
  ] },
  { a: 'SILDENAFILA', b: 'NITRATO', ca: CY, cb: R, selo: ['PROIBIDO', R, 'proibida'], itens: [
    ['erétil', 'i', 'sildenafila: disfunção erétil'],
    ['isossorbida', 'i', 'nitrato (isossorbida): dor no peito'],
    ['caminho', '!', 'os dois abrem os vasos pelo mesmo caminho'],
    ['despencar', 'X', 'a pressão despenca: desmaio, infarto'],
    ['vinte', '!', 'nitrato só depois de 24 horas'],
  ] },
];
const S = {
  cortar: T('cortar'), somar: T('somar'), sete: T('sete'),
  recap: T('recapitulando') - 0.3, regra: T('regra') - 0.3, siga: T('me', T('regra')) - 0.2, consulte: NARR + 0.3,
};
CAPS.forEach((c, i) => {
  c.de = Tn('número', i + 1) - 0.3;
  c.itens.forEach(it => { it.at = T(it[0], c.de); });
  c.seloAt = T(c.selo[2], c.de);
});
CAPS.forEach((c, i) => { c.ate = i < 6 ? CAPS[i + 1].de : S.recap; });
const RECAP = [
  ['anticoncepcional', 'Anticoncepcional só perde efeito com a rifampicina', PK],
  ['atrapalha', 'Anti-inflamatório atrapalha a pressão e pode lesar o rim', A],
  ['enfraquece', 'Omeprazol enfraquece o clopidogrel', CY],
  ['sangramento', 'Varfarina + anti-inflamatório: sangramento', R],
  ['toranja', 'Sinvastatina: nada de claritromicina nem toranja', PK],
  ['ferro', 'Levotiroxina longe do cálcio e do ferro', CY],
  ['nunca', 'Sildenafila nunca junto com nitrato', R],
].map(r => [T(r[0], S.recap), r[1], r[2]]);
const REGRA = [
  ['conta', 'conte ao médico e ao farmacêutico TODOS os remédios'],
  ['inclusive', 'inclusive os sem receita, as vitaminas e os chás'],
  ['nunca', 'nunca pare ou troque um remédio por conta própria'],
].map(r => [T(r[0], S.regra), r[1]]);
const CENAS = [0, ...CAPS.map(c => c.de), S.recap, S.regra, S.siga, S.consulte - 0.05];
const vis = (t, a, b, fi = 0.25, fo = 0.25) => Math.min(cl((t - a) / fi), cl((b - t) / fo));

// efeitos sonoros: carimbos, trocas de cena e cada linha nova do terminal
window.SFX = [
  [S.cortar, 'pop', 0.2], [S.somar, 'trava', 0.25], [S.sete, 'bip', 0.2],
  ...CAPS.flatMap(c => [[c.de, 'whoosh', 0.28], [c.seloAt, 'trava', 0.3], ...c.itens.map(it => [it.at, 'bip', 0.12])]),
  [S.recap, 'whoosh', 0.28], ...RECAP.map(r => [r[0], 'pop', 0.16]),
  [S.regra, 'whoosh', 0.28], [S.siga, 'whoosh', 0.28], [S.consulte, 'plim', 0.3],
].filter(s => s[0] < 1e8);

// ---------- peças ----------
// cápsula em pixel art
function capsula(x, y, s, cor, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.shadowColor = cor; g.shadowBlur = 26;
  px(-120, -48, 120, 96, cor); px(-144, -36, 24, 72, cor);
  px(0, -48, 120, 96, '#e9f3ee'); px(120, -36, 24, 72, '#e9f3ee');
  g.shadowBlur = 0; px(-108, -36, 60, 14, 'rgba(255,255,255,0.55)');
  g.restore();
}
function raio(x, y, s, a) {
  g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha *= a;
  g.shadowColor = A; g.shadowBlur = 30; g.fillStyle = A;
  g.beginPath(); g.moveTo(12, -70); g.lineTo(-30, 8); g.lineTo(0, 8); g.lineTo(-14, 70); g.lineTo(32, -12); g.lineTo(2, -12); g.closePath(); g.fill();
  g.restore();
}
const MARCA = { OK: G, '!': A, X: R, i: CY, '>': WH };
function terminal(t, x, y, w, h, titulo, itens) {
  box(x, y, w, h, G, { lit: 0.25 });
  g.fillStyle = rgba(G, 0.15); g.fillRect(x + 4, y + 4, w - 8, 52);
  text(titulo, x + 24, y + 42, 30, { font: SILK, color: G, bold: true });
  let yy = y + 110;
  itens.forEach(([at, mk, s]) => {
    if (t < at) return;
    const u = k(t, at, 0.2);
    const cor = MARCA[mk];
    text(`[${mk}]`, x + 24, yy, 48, { color: cor, glow: 8, alpha: u });
    const ls = linhas(s, 48, w - 170);
    const tot = ls.join(' ').length;
    const n = Math.min(tot, Math.floor((t - at) * 45) + 1);
    let usado = 0;
    ls.forEach((l, li) => {
      const m = cl(n - usado, 0, l.length); usado += l.length + 1;
      if (m > 0) text(l.slice(0, m) + (n < tot && m < l.length ? '█' : ''), x + 130, yy + li * 54, 48, { color: WH, alpha: u });
    });
    yy += ls.length * 54 + 18;
  });
}

// ---------- legendas palavra por palavra ----------
const KEYS = ['interação', 'medicamentosa', 'cortar', 'somar', 'sete', 'mito', 'rifampicina', 'tripla', 'rins', 'omeprazol', 'clopidogrel', 'pantoprazol', 'varfarina', 'sangramento', 'paracetamol', 'sinvastatina', 'claritromicina', 'toranja', 'levotiroxina', 'jejum', 'sildenafila', 'nitrato', 'proibida', 'regra', 'ouro', 'siga'];
const clean = w => w.toLowerCase().replace(/[.,!?:;"]/g, '');
const GRUPOS = (() => {
  const out = []; let cur = [];
  WORDS.forEach((w, i) => {
    cur.push(w);
    const end = /[.?!:]$/.test(w.w) || cur.length >= 8 || (/,$/.test(w.w) && cur.length >= 4);
    if (end || i === WORDS.length - 1) { out.push(cur); cur = []; }
  });
  return out.map((ws, i) => {
    let key = ws.findIndex(w => KEYS.includes(clean(w.w)));
    if (key < 0) key = ws.reduce((b, w, j) => clean(w.w).length > clean(ws[b].w).length ? j : b, 0);
    return { ws, key, de: ws[0].s, ate: (out[i + 1] ? out[i + 1][0].s : ws[ws.length - 1].e + 0.5) };
  });
})();
function legenda(t) {
  if (t >= S.siga - 0.05) return;
  const gr = GRUPOS.find(gp => t >= gp.de - 0.05 && t < gp.ate);
  if (!gr) return;
  const size = 44; g.font = `700 ${size}px ${SILK}`;
  const sp = g.measureText(' ').width;
  const items = gr.ws.map((w, j) => ({ w: w.w.toUpperCase(), s: w.s, key: j === gr.key, wd: g.measureText(w.w.toUpperCase()).width }));
  const lines = [[]]; let lw = 0;
  items.forEach(it => { if (lw + it.wd > 1700 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(it); lw += it.wd + sp; });
  const y0 = 960 - (lines.length - 1) * 30;
  lines.forEach((ln, li) => {
    const total = ln.reduce((s, it) => s + it.wd, 0) + sp * (ln.length - 1);
    let x = 960 - total / 2;
    ln.forEach(it => {
      if (t >= it.s - 0.04) {
        const u = cl((t - it.s + 0.04) / 0.12);
        g.save(); g.font = `700 ${size}px ${SILK}`; g.textBaseline = 'middle';
        g.translate(x + it.wd / 2, y0 + li * 60); g.scale(0.85 + 0.15 * u, 0.85 + 0.15 * u); g.globalAlpha = u;
        g.textAlign = 'center'; g.lineJoin = 'round'; g.lineWidth = 12; g.strokeStyle = '#000'; g.strokeText(it.w, 0, 0);
        g.fillStyle = it.key ? A : '#ffffff'; if (it.key) { g.shadowColor = A; g.shadowBlur = 14; }
        g.fillText(it.w, 0, 0); g.restore();
      }
      x += it.wd + sp;
    });
  });
}

function barra(t) {
  g.fillStyle = 'rgba(0,10,4,0.92)'; g.fillRect(0, 0, W, 84);
  g.fillStyle = G; g.fillRect(0, 80, W, 4);
  text('C:\\> INTERACOES.EXE', 36, 56, 32, { font: SILK, color: G, glow: 10, bold: true });
  // progresso: 7 quadradinhos
  const atual = CAPS.findIndex(c => t >= c.de && t < c.ate);
  CAPS.forEach((c, i) => {
    const feito = t >= c.de;
    const x = 1440 + i * 62;
    g.save(); g.strokeStyle = feito ? G : rgba(G, 0.35); g.lineWidth = 3; g.strokeRect(x, 22, 46, 40);
    if (feito) { g.fillStyle = i === atual ? A : rgba(G, 0.5); g.fillRect(x + 6, 28, 34, 28); }
    g.restore();
    text(String(i + 1), x + 23, 52, 26, { font: SILK, color: feito ? BG : rgba(G, 0.5), bold: true, align: 'center' });
  });
}

// ---------- cenas ----------
function abertura(t) {
  const a = vis(t, -1, CAPS[0].de);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('7 REMÉDIOS', t, 0.2, 960, 230, 110, { font: SILK, color: A, glow: 24, bold: true, align: 'center', cps: 14 });
  typed('QUE NÃO COMBINAM', t, 0.9, 960, 350, 96, { font: SILK, color: G, glow: 22, bold: true, align: 'center', cps: 18 });
  const p = back(k(t, 0.6, 0.6));
  const choque = Math.max(0, Math.sin(t * 3)) * 18;
  if (p > 0) { capsula(700 + choque, 540, p * 1.1, PK, -0.35); capsula(1220 - choque, 540, p * 1.1, CY, 0.35); }
  raio(960, 540, 1.3, cl((t - 1.2) / 0.3) * (0.7 + 0.3 * Math.sin(t * 12)));
  chip('CORTA O EFEITO', 560, 760, t, S.cortar - 0.2, CY, 40);
  chip('SOMA O PERIGO', 1360, 760, t, S.somar - 0.2, R, 40);
  g.restore();
}
function capitulo(t, c, i) {
  const a = vis(t, c.de, c.ate);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed(`#${i + 1}`, t, c.de + 0.05, 80, 190, 80, { font: SILK, color: G, glow: 18, bold: true, cps: 10 });
  // os dois remédios
  const p1 = back(k(t, c.de + 0.3, 0.5)), p2 = back(k(t, c.de + 0.6, 0.5));
  const bate = t > c.de + 1 ? Math.max(0, Math.sin((t - c.de) * 2.4)) * 10 : 0;
  if (p1 > 0) capsula(250 + bate, 400, p1 * 0.9, c.ca, -0.3);
  if (p2 > 0) capsula(560 - bate, 400, p2 * 0.9, c.cb, 0.3);
  raio(405, 400, 1, cl((t - c.de - 1) / 0.3) * (0.6 + 0.4 * Math.sin(t * 10)));
  const ta = linhas(c.a, 40, 640, SILK), tb = linhas(c.b, 40, 640, SILK);
  ta.forEach((l, j) => typed(l, t, c.de + 0.4, 405, 560 + j * 50, 40, { font: SILK, color: c.ca, bold: true, align: 'center', glow: 10, cps: 30 }));
  text('+', 405, 560 + ta.length * 50 + 6, 44, { font: SILK, color: WH, bold: true, align: 'center', alpha: cl((t - c.de - 0.6) / 0.3) });
  tb.forEach((l, j) => typed(l, t, c.de + 0.7, 405, 560 + (ta.length + 1) * 50 + j * 50 + 6, 40, { font: SILK, color: c.cb, bold: true, align: 'center', glow: 10, cps: 30 }));
  terminal(t, 820, 120, 1040, 680, `> analisar.exe  ${i + 1}/7`, c.itens.map(it => [it.at, it[1], it[2]]));
  stamp(c.selo[0], t, c.seloAt, 405, 250, c.selo[1], { rot: -6, size: c.selo[0].length > 14 ? 40 : 52 });
  g.restore();
}
function recap(t) {
  const a = vis(t, S.recap, S.regra);
  if (a <= 0) return;

  typed('RECAPITULANDO', t, S.recap + 0.05, 960, 175, 64, { font: SILK, color: A, glow: 18, bold: true, align: 'center', cps: 16 });

  RECAP.forEach(([at, s, cor], i) => {
    if (t < at) return;

    px(290, 262 + i * 78, 54, 54, cor);
    text(String(i + 1), 317, 305 + i * 78, 34, { font: SILK, color: BG, bold: true, align: 'center' });
    text(s, 380, 307 + i * 78, 52, { color: WH });
    g.restore();
  });
  g.restore();
}
function regra(t) {

}
function siga(t) {

function final(t) {
  const a = cl((t - S.consulte + 0.05) / 0.3);

  text('Ref.: SDCEP/FSRH · Lapi et al., BMJ 2013 · FDA · MHRA · bulas (Anvisa)', 960, 840, 28, { color: rgba(WH, 0.65), align: 'center', alpha: cl((t - S.consulte - 1.4) / 0.4) });
  g.restore();
}
function glitch(t) {
  const c = CENAS.find(s => s > 0 && t >= s && t < s + 0.22);
  if (c === undefined) return;
  const u = 1 - (t - c) / 0.22;
  for (let i = 0; i < 9; i++) {
    const y = Math.floor(rnd(i + Math.floor(t * 30)) * H), h = 16 + rnd(i + 7) * 60;
    const dx = (rnd(i + 3 + Math.floor(t * 60)) - 0.5) * 140 * u;
    g.drawImage(cv, 0, y, W, h, dx, y, W, h);

  g.fillStyle = rgba(R, 0.12 * u); g.fillRect(0, 0, W, H);
  g.fillStyle = rgba(CY, 0.08 * u); g.fillRect(8 * u, 0, W, H);
}

window.draw = function (t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.shadowBlur = 0;
  fundo(t);
  abertura(t); CAPS.forEach((c, i) => capitulo(t, c, i)); recap(t); regra(t); siga(t); final(t);
