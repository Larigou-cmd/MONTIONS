const W = 1080, H = 1920, END = 90.4;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, u) => a + (b - a) * u;

const INK = '#121417', INK2 = '#1B1E23', INK3 = '#22262C', ACC = '#F2CF1D', ACCL = '#F8DE4A', ACCD = '#D8B30C', GOLD = '#D4B064', PAPER = '#F4F1E8', HOT = '#FE6B3D', OLIVE = '#6E5A1E', GREEN = '#4FD18B';

    x.save(); x.translate(W * (0.2 + i * 0.25), 0); x.rotate(0.35); x.fillStyle = gr; x.fillRect(-120, -200, 180, H + 600); x.restore(); }
  x.strokeStyle = 'rgba(255,255,255,0.035)'; x.lineWidth = 1; for (let i = 0; i <= W; i += 60) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); } for (let j = 0; j <= H; j += 60) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
  const v = x.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1200); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); x.fillStyle = v; x.fillRect(0, 0, W, H);

const IMG = {}; let carregadas = 0; const total = Object.keys(SRC).length;

function text(txt, x, y, size, col, align = 'left', a = 1, font = COND, weight = 700, max = 0) { if (a <= 0 || !txt) return; g.save(); g.globalAlpha *= a; g.font = `${weight} ${size}px ${font}`;

  g.font = `700 28px ${MONO}`; g.fillText('NOTÍCIAS DA FARMÁCIA', 0, 74); g.restore(); }
function bug(a) { plate(905, 130, 0.33, a); }
function eyebrow(txt, y, a) { text(txt, 80, y, 34, GOLD, 'left', a, MONO, 700, 920); }

function card(x, y, w, h, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = INK2; g.fillRect(x, y, w, h); g.fillStyle = ACC; g.fillRect(x, y, w, 8); g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 2; g.strokeRect(x, y, w, h); g.restore(); }

  g.textAlign = 'center'; g.fillText(txt, 0, size * 0.36); g.restore();

function cross(x, y, a, col = HOT) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(x, y); const s = back(a); g.scale(s, s); g.fillStyle = col; g.beginPath(); g.arc(0, 0, 36, 0, 7); g.fill();
  g.strokeStyle = INK; g.lineWidth = 9; g.lineCap = 'round'; g.beginPath(); g.moveTo(-13, -13); g.lineTo(13, 13); g.moveTo(13, -13); g.lineTo(-13, 13); g.stroke(); g.restore(); }
function flapTile(x, y, w, h, from, to, t0, t) { const u = cl((t - t0) / 0.3); g.save(); g.fillStyle = INK3; g.fillRect(x, y, w, h); g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(x, y + h / 2 - 2, w, 4);
  const cur = u < 0.5 ? from : to; g.beginPath(); g.rect(x, y, w, h); g.clip(); g.translate(x + w / 2, y + h / 2); g.scale(1, u < 1 ? Math.abs(Math.cos(u * Math.PI)) * 0.9 + 0.1 : 1);
  g.font = `800 ${h * 0.72}px ${COND}`; { const mw = g.measureText(cur).width; if (mw > w - 30) g.font = `800 ${h * 0.72 * (w - 30) / mw}px ${COND}`; } g.textAlign = 'center'; g.fillStyle = cur === '?' || cur === '??' ? 'rgba(244,241,232,0.3)' : ACC; g.fillText(cur, 0, h * 0.26); g.restore(); }

function pen(cx, cy, s, rot, a, cor = '#3B82C4') { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.rotate(rot); g.scale(s, s);

function photo(im, x, y, w, h, a, o = {}) { if (a <= 0 || !im || !im.width) return; g.save(); g.globalAlpha *= a;
  g.fillStyle = PAPER; g.fillRect(x - 10, y - 10, w + 20, h + 20); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const z = 1 + (o.zoom || 0), ir = im.width / im.height, br = w / h; let sw, sh; if (ir > br) { sh = im.height / z; sw = sh * br; } else { sw = im.width / z; sh = sw / br; }

  g.fillStyle = INK; g.font = `800 34px ${COND}`; g.textAlign = 'center'; g.fillText('F', SX + SW + 45, SY + 72);

function sting(t) { const sl = [0.04, 0.1]; sl.forEach((t0, i) => { const u = ss(t0, t0 + 0.25, t) * (1 - ss(0.5, 0.7, t)); if (u <= 0) return; g.save(); g.globalAlpha = u; g.fillStyle = i ? GOLD : ACC; g.translate(540, 700); g.rotate(-0.5); g.fillRect(-700, -30 + i * 80, 1400 * u, 26); g.restore(); });
  const sl2 = cl((t - 0.05) / 0.2), fly = ss(0.55, 0.9, t), s = lerp(lerp(0.2, 1.25, back(sl2)), 0.33, fly), cx = lerp(540, 905, fly), cy = lerp(720, 130, fly);
  const shake = t > 0.2 && t < 0.45 ? Math.sin(t * 90) * 8 * (0.45 - t) / 0.25 : 0; if (t >= 0.05) plate(cx + shake, cy, s, 1, cl((t - 0.28) / 0.3));
