<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pílula do dia seguinte</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="words.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Vídeo "PILULA.EXE" (Modelo 2): tudo é desenhado por draw(t), t em segundos da narração (narracao.mp3, voz da Juliana).
// Os tempos abaixo vêm da transcrição palavra a palavra (words.js). Roteiro: roteiro.md.
const W = 1080, H = 1920;
const NARR = 101.52;            // duração da narração
window.END = NARR + 3.2;       // segura a tela final um pouco depois da última palavra
const cv = document.getElementById('c'), g = cv.getContext('2d');
const G = '#39ff6a', A = '#ffc23d', R = '#ff4d6d', CY = '#3de0ff', BG = '#020c06', WH = '#eafff0', PK = '#ff8ad8';
const SILK = "'Silk'", VT = "'VT'";

// ---------- utilidades ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const k = (t, a, d = 0.35) => cl((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.9; x = cl(x); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, u) => a + (b - a) * u;
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function text(s, x, y, size, { font = VT, color = WH, align = 'left', alpha = 1, glow = 0, bold = false, base = 'alphabetic' } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = `${bold ? 700 : 400} ${size}px ${font}`; g.textAlign = align; g.textBaseline = base;
  if (glow) { g.shadowColor = color; g.shadowBlur = glow; }
  g.fillStyle = color; g.fillText(s, x, y); g.restore();
}
// texto digitado letra por letra (com cursor enquanto digita)
function typed(s, t, at, x, y, size, opt = {}) {
  if (t < at) return;
  const cps = opt.cps || 22;
  const n = Math.min(s.length, Math.floor((t - at) * cps) + 1);
  const shown = s.slice(0, n) + (n < s.length || opt.cursor ? (Math.floor(t * 2.5) % 2 ? '█' : ' ') : '');
  text(shown, x, y, size, opt);
}
function box(x, y, w, h, color, { lit = 0, alpha = 1, fill = 'rgba(2,20,10,0.88)', lw = 4 } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha;
  g.fillStyle = fill; g.fillRect(x, y, w, h);
  g.shadowColor = color; g.shadowBlur = 8 + 30 * lit;
  g.strokeStyle = color; g.lineWidth = lw + 2 * lit; g.strokeRect(x, y, w, h);
  g.shadowBlur = 0;
  g.fillStyle = color; [[x, y], [x + w - 12, y], [x, y + h - 12], [x + w - 12, y + h - 12]].forEach(([a, b]) => g.fillRect(a, b, 12, 12));
  g.restore();
}
// carimbo torto que cai com impacto
function stamp(s, t, at, x, y, color, { rot = -8, size = 64, font = SILK } = {}) {
  if (t < at) return;
  const u = cl((t - at) / 0.22);
  const sc = lerp(2.6, 1, eo(u));
  const shake = u >= 1 ? Math.max(0, 1 - (t - at - 0.22) / 0.25) * 8 * Math.sin((t - at) * 90) : 0;
  g.save(); g.translate(x + shake, y); g.rotate(rot * Math.PI / 180); g.scale(sc, sc); g.globalAlpha *= cl(u * 1.6);
  g.font = `700 ${size}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(s).width + 50, h = size + 34;
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(-w / 2, -h / 2, w, h);
  g.strokeStyle = color; g.lineWidth = 8; g.shadowColor = color; g.shadowBlur = 24; g.strokeRect(-w / 2, -h / 2, w, h);
  g.lineWidth = 3; g.strokeRect(-w / 2 + 12, -h / 2 + 12, w - 24, h - 24);
  g.shadowBlur = 12; g.fillStyle = color; g.fillText(s, 0, 4);
  g.restore();
}
const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x / 6) * 6, Math.round(y / 6) * 6, Math.round(w / 6) * 6, Math.round(h / 6) * 6); };
// card que desliza de um lado
function slide(t, at, dir, fn) {
  if (t < at) return;
  const u = eo(k(t, at, 0.35));
  g.save(); g.translate((1 - u) * 600 * dir, 0); g.globalAlpha *= cl(u * 1.5); fn(); g.restore();
}

// ---------- fundo ----------
function fundo(t) {
  const rg = g.createRadialGradient(540, 800, 100, 540, 900, 1300);
  rg.addColorStop(0, '#062a14'); rg.addColorStop(1, BG);
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.font = `34px ${VT}`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  for (let c = 0; c < 27; c++) {
    const sp = 40 + rnd(c) * 70, off = rnd(c + 50) * 2400;
    for (let r = 0; r < 14; r++) {
      const y = ((t * sp + off + r * 40) % 2400) - 300;
      const bit = (Math.floor(t * 3 + c * 7 + r * 3) % 3) === 0 ? '1' : '0';
      g.fillStyle = rgba(G, (0.03 + 0.05 * (r / 14)) * (0.6 + 0.4 * rnd(c + r)));
      g.fillText(bit, c * 40 + 6, y);
    }
  }
  const hy = 1380, vx = 540;
  g.save(); g.strokeStyle = rgba(G, 0.22); g.lineWidth = 2;
  for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(vx + i * 30, hy); g.lineTo(vx + i * 260, H); g.stroke(); }
  for (let j = 0; j < 14; j++) {
    const u = ((j + (t * 0.6) % 1) / 14);
    const y = hy + Math.pow(u, 2.2) * (H - hy);
    g.globalAlpha = 0.25 + 0.75 * u; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  g.restore();
  const fade = g.createLinearGradient(0, hy - 40, 0, hy + 200);
  fade.addColorStop(0, BG); fade.addColorStop(1, 'rgba(2,12,6,0)');
  g.fillStyle = fade; g.fillRect(0, hy - 40, W, 240);
}
function crt() {
  g.fillStyle = 'rgba(0,0,0,0.18)';
  for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
  const v = g.createRadialGradient(540, 960, 520, 540, 960, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.78)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function barra(t) {
  g.fillStyle = 'rgba(0,10,4,0.92)'; g.fillRect(0, 60, W, 104);
  g.fillStyle = G; g.fillRect(0, 160, W, 4);
  text('C:\\> PILULA_DIA_SEGUINTE.EXE', 40, 126, 34, { font: SILK, color: G, glow: 10, bold: true });
}

// ---------- legendas palavra por palavra ----------
const KEYS = ['pílula', 'seguinte', 'abortiva', 'hora', 'corpo', 'levonorgestrel', 'progesterona', 'única', '1,5', 'cinco', 'dias', 'liberado', 'lh', 'bloqueia', 'atrasa', 'acontece', 'encontrar', 'gravidez', 'útero', 'interrompe', '72', 'menos', 'melhor', 'mês', 'aquela', 'transmissíveis', 'atenta', 'vomitar', 'três', 'dose', 'menstruação', 'emergência', 'rotina', 'profissional', 'você', 'siga', 'farmacologia', 'área', 'sinal', 'ovário', 'cérebro', 'espermatozoides'];
const clean = w => w.toLowerCase().replace(/[.,!?:;]/g, '');
const GRUPOS = (() => {
  const out = []; let cur = [];
  WORDS.forEach((w, i) => {
    cur.push(w);
    const end = /[.?!:]$/.test(w.w) || cur.length >= 7 || (/,$/.test(w.w) && cur.length >= 4);
    if (end || i === WORDS.length - 1) { out.push(cur); cur = []; }
  });
  return out.map((ws, i) => {
    let key = ws.findIndex(w => KEYS.includes(clean(w.w)));
    if (key < 0) key = ws.reduce((b, w, j) => clean(w.w).length > clean(ws[b].w).length ? j : b, 0);
    return { ws, key, de: ws[0].s, ate: (out[i + 1] ? out[i + 1][0].s : ws[ws.length - 1].e + 0.5) };
  });
})();
function legenda(t) {
  if (t >= S.consulte - 0.05) return;
  const gr = GRUPOS.find(gp => t >= gp.de - 0.05 && t < gp.ate);
  if (!gr) return;
  const size = 50; g.font = `700 ${size}px ${SILK}`;
  const sp = g.measureText(' ').width;
  const items = gr.ws.map((w, j) => ({ w: w.w.toUpperCase(), s: w.s, key: j === gr.key, wd: g.measureText(w.w.toUpperCase()).width }));
  const lines = [[]]; let lw = 0;
  items.forEach(it => { if (lw + it.wd > 960 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(it); lw += it.wd + sp; });
  const y0 = 1490 - (lines.length - 1) * 34;
  lines.forEach((ln, li) => {
    const total = ln.reduce((s, it) => s + it.wd, 0) + sp * (ln.length - 1);
    let x = 540 - total / 2;
    ln.forEach(it => {
      if (t >= it.s - 0.04) {
        const u = cl((t - it.s + 0.04) / 0.12);
        g.save(); g.font = `700 ${size}px ${SILK}`; g.textBaseline = 'middle';
        g.translate(x + it.wd / 2, y0 + li * 68); g.scale(0.85 + 0.15 * u, 0.85 + 0.15 * u); g.globalAlpha = u;
        g.textAlign = 'center'; g.lineJoin = 'round'; g.lineWidth = 12; g.strokeStyle = '#000'; g.strokeText(it.w, 0, 0);
        g.fillStyle = it.key ? A : '#ffffff'; if (it.key) { g.shadowColor = A; g.shadowBlur = 14; }
        g.fillText(it.w, 0, 0); g.restore();
      }
      x += it.wd + sp;
    });
  });
}

// ---------- tempos: procurados na transcrição (palavra, ocorrência) ----------
const norm = w => w.toLowerCase().replace(/[.,!?:;]/g, '');
function T(word, n = 1) {
  let c = 0;
  for (const w of WORDS) if (norm(w.w) === word && ++c === n) return w.s;
  console.warn('tempo não achado', word, n); return 1e9;
}
const S = {
  abortiva: T('abortiva'), qualquer: T('qualquer'), vem: T('vem'),
  oque: T('pílula', 2) - 0.3, levo: T('levonorgestrel'), hormonio: T('hormônio'), proges: T('progesterona'), dose: T('dose'), mg: T('1,5'),
  ciclo: T('lembra') - 0.5, esperma: T('espermatozoides'), cinco: T('cinco'), liberado: T('liberado'),
  mec: T('sair') - 0.9, ovario: T('ovário'), cerebro: T('cérebro'), sinal: T('sinal'), lh: T('lh'), pilula3: T('pílula', 3), bloqueia: T('bloqueia'), acontece: T('acontece'), sem: T('sem'), encontrar: T('encontrar'),
  mito1: T('por') - 0.1, abortiva2: T('abortiva', 2), gravidez: T('gravidez'), embriao: T('embrião'), utero: T('útero'), interrompe: T('interrompe'),
  mito2: T('usada', 2) - 0.6, cinco2: T('cinco', 2), h72: T('72'), aconteceu: T('aconteceu'), menos: T('menos'), quanto: T('quanto'),
  mito3: T('outro') - 0.1, resto: T('resto'), naoProtege: T('protege', 2), aquela: T('aquela'), ists: T('infecções'),
  cuidados: T('fique') - 0.2, vomitar: T('vomitar'), tres: T('três'), orientacao: T('orientação'), repetir: T('repetir'), menstruacao: T('menstruação'),
  fim: T('pílula', 5) - 0.3, emergencia: T('emergência'), rotina: T('rotina'), proteger: T('proteger'), profissional: T('profissional'),
  siga: T('me'), consulte: NARR + 0.2,
};
const CENAS = [0, S.oque, S.ciclo, S.mec, S.mito1, S.mito2, S.mito3, S.cuidados, S.fim, S.siga, S.consulte - 0.05];
const vis = (t, a, b, fi = 0.25, fo = 0.25) => Math.min(cl((t - a) / fi), cl((b - t) / fo));

// ---------- peças em pixel art ----------
function comprimido(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.shadowColor = PK; g.shadowBlur = 34;
  px(-60, -90, 120, 180, '#fbe8f4'); px(-90, -60, 180, 120, '#fbe8f4'); px(-78, -78, 156, 156, '#fbe8f4');
  g.shadowBlur = 0;
  px(-54, -66, 48, 18, '#ffffff');
  text('1,5', 0, 22, 56, { font: SILK, color: '#c0398f', align: 'center', bold: true });
  g.restore();
}
function cartela(x, y, s, t, at) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.shadowColor = CY; g.shadowBlur = 16; px(-150, -110, 300, 220, rgba(CY, 0.18)); g.shadowBlur = 0;
  g.strokeStyle = CY; g.lineWidth = 6; g.strokeRect(-150, -110, 300, 220);
  g.restore();
  comprimido(x, y, s * 0.75);
}
function esperma(x, y, t, i, rot = 0, alpha = 1, s = 1) {
  g.save(); g.globalAlpha *= alpha; g.translate(x, y); g.rotate(rot); g.scale(s, s);
  for (let j = 0; j < 7; j++) px(-24 - j * 12, Math.sin(t * 9 + i + j * 0.9) * (3 + j * 1.6) - 3, 12, 6, rgba(WH, 0.85 - j * 0.08));
  g.shadowColor = WH; g.shadowBlur = 10; px(-18, -12, 30, 24, WH); g.restore();
}
function ovulo(x, y, s, t, alpha = 1) {
  g.save(); g.globalAlpha *= alpha; g.translate(x, y); g.scale(s, s);
  g.shadowColor = A; g.shadowBlur = 20; px(-36, -24, 72, 48, A); px(-24, -36, 48, 72, A); g.shadowBlur = 0;
  px(-12, -12, 24, 24, '#ffe7a3'); g.restore();
}
function ovario(x, y, t, trava) {
  g.save(); g.translate(x, y);
  g.shadowColor = CY; g.shadowBlur = 16;
  px(-180, -84, 360, 168, rgba(CY, 0.18)); g.shadowBlur = 0;
  g.strokeStyle = CY; g.lineWidth = 6; g.strokeRect(-180, -84, 360, 168);
  [[-130, -50], [100, 30], [-90, 40], [120, -50]].forEach(([a, b]) => px(a, b, 24, 24, rgba(CY, 0.5)));
  ovulo(0, 0, 1, t);
  if (trava > 0) {
    g.globalAlpha *= trava; g.strokeStyle = G; g.lineWidth = 6; g.setLineDash([12, 10]); g.strokeRect(-70, -66, 140, 132); g.setLineDash([]);
    px(-24, -132, 48, 42, G); px(-14, -150, 6, 24, G); px(8, -150, 6, 24, G); px(-14, -156, 28, 8, G);
  }
  g.restore();
}
function cerebro(x, y, s, lit) {
  g.save(); g.translate(x, y); g.scale(s, s); g.shadowColor = PK; g.shadowBlur = 10 + 20 * lit;
  px(-96, -48, 192, 96, rgba(PK, 0.9)); px(-72, -72, 144, 30, rgba(PK, 0.9)); px(-72, 42, 144, 24, rgba(PK, 0.9));
  g.shadowBlur = 0;
  px(-6, -66, 12, 120, '#8a2a6c'); px(-72, -12, 48, 8, '#8a2a6c'); px(30, 6, 48, 8, '#8a2a6c'); px(-54, 24, 36, 8, '#8a2a6c'); px(24, -36, 42, 8, '#8a2a6c');
  g.restore();
}
function escudo(x, y, s, cor, quebra = 0) {
  g.save(); g.translate(x, y); g.scale(s, s); g.shadowColor = cor; g.shadowBlur = 24;
  for (const lado of [-1, 1]) {
    g.save(); g.translate(lado * 18 * quebra, 10 * quebra); g.rotate(lado * 0.15 * quebra);
    const cols = lado < 0 ? [-72, -48, -24] : [0, 24, 48];
    cols.forEach((cx, i) => {
      const d = Math.abs(cx + 12) / 72;
      const h = 150 - d * 70;
      px(cx, -78, 24, h, rgba(cor, 0.9));
    });
    g.restore();
  }
  g.restore();
}
function utero(x, y, t, emb) {
  g.save(); g.translate(x, y); g.shadowColor = PK; g.shadowBlur = 16;
  px(-240, -120, 90, 24, PK); px(150, -120, 90, 24, PK);
  px(-150, -120, 300, 36, PK); px(-150, -84, 36, 150, PK); px(114, -84, 36, 150, PK);
  px(-114, 60, 36, 48, PK); px(78, 60, 36, 48, PK); px(-78, 102, 156, 36, PK); px(-30, 132, 60, 60, PK);
  g.shadowBlur = 0; px(-114, -84, 228, 186, rgba(PK, 0.16));
  if (emb > 0) { g.globalAlpha *= emb; ovulo(30, -50, 0.9 + 0.1 * Math.sin(t * 4), t); }
  g.restore();
}

// ---------- cenas ----------
function cena1(t) {
  const a = vis(t, -1, S.oque + 0.05);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  const pop = back(k(t, 0.2, 0.5));
  if (pop > 0) comprimido(540, 470 + Math.sin(t * 2) * 10, pop * 1.4);
  if (t > 0.6) text('?', 760, 420 + Math.sin(t * 3) * 8, 150, { font: SILK, color: A, bold: true, glow: 20, alpha: cl((t - 0.6) / 0.3) });
  typed('PÍLULA DO', t, 0.6, 540, 730, 92, { font: SILK, color: G, glow: 22, bold: true, align: 'center', cps: 18 });
  typed('DIA SEGUINTE', t, 1.2, 540, 830, 92, { font: SILK, color: G, glow: 22, bold: true, align: 'center', cps: 18 });
  stamp('ABORTIVA?', t, S.abortiva, 290, 950, R, { rot: -7, size: 50 });
  stamp('QUALQUER HORA?', t, S.qualquer, 700, 1060, A, { rot: 6, size: 44 });
  if (t >= S.vem - 0.2) {
    const u = eo(k(t, S.vem - 0.2, 0.3));
    box(70, 1150, 940, 170, G, { alpha: u, lit: 0.5 + 0.3 * Math.sin(t * 6) });
    text('C:\\> pergunta.txt', 100, 1195, 32, { color: rgba(G, 0.7), alpha: u });
    typed('> o que ela faz no corpo?', t, S.vem, 100, 1275, 58, { color: G, glow: 10, cps: 16, cursor: true });
  }
  g.restore();
}

function cena2(t) {
  const a = vis(t, S.oque, S.ciclo);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('O QUE É', t, S.oque + 0.1, 540, 270, 70, { font: SILK, color: G, glow: 18, bold: true, align: 'center', cps: 18 });
  typed('> a mais usada no Brasil', t, S.oque + 0.6, 540, 340, 46, { color: A, align: 'center', cps: 28 });
  slide(t, S.levo - 0.2, -1, () => {
    box(70, 390, 940, 170, G, { lit: t < S.hormonio ? 0.9 : 0.2 });
    text('LEVONORGESTREL', 540, 495, 66, { font: SILK, color: G, bold: true, align: 'center', glow: 14 });
  });
  // marcas mais conhecidas nas farmácias
  if (t >= S.levo + 0.2) text('NAS FARMÁCIAS:', 540, 600, 30, { font: SILK, color: rgba(CY, 0.85), bold: true, align: 'center', alpha: cl((t - S.levo - 0.2) / 0.3) });
  const MARCAS = [['POSTINOR UNO', 250, 660], ['POZATO UNI', 620, 660], ['DIAD', 900, 660], ['NEODIA', 250, 740], ['POSLOV', 560, 740], ['GENÉRICOS', 850, 740]];
  MARCAS.forEach(([m, x, y], i) => {
    const at = S.levo + 0.4 + i * 0.18;
    if (t < at) return;
    const u = back(k(t, at, 0.3));
    g.save(); g.translate(x, y); g.scale(u, u);
    g.font = `700 32px ${SILK}`; const w = g.measureText(m).width + 40;
    box(-w / 2, -30, w, 60, CY, { lit: 0.5, lw: 3 });
    text(m, 0, 12, 32, { font: SILK, color: i === 5 ? A : WH, bold: true, align: 'center' });
    g.restore();
  });
  slide(t, S.hormonio - 0.1, 1, () => {
    box(70, 800, 940, 180, PK, { lit: t < S.dose ? 0.8 : 0.15 });
    text('HORMÔNIO PARECIDO COM A', 540, 870, 38, { font: SILK, color: PK, bold: true, align: 'center' });
    if (t >= S.proges) text('PROGESTERONA', 540, 945, 60, { font: SILK, color: WH, bold: true, align: 'center', glow: 12, alpha: cl((t - S.proges) / 0.3) });
  });
  if (t >= S.dose - 0.2) {
    const u = back(k(t, S.dose - 0.2, 0.45));
    cartela(300, 1140, u * 0.8, t);
    text('1 COMPRIMIDO', 720, 1080, 44, { font: SILK, color: WH, bold: true, align: 'center', alpha: cl(u) });
  }
  stamp('DOSE ÚNICA', t, S.dose + 0.3, 720, 1160, A, { rot: -6, size: 46 });
  stamp('1,5 mg', t, S.mg, 720, 1280, G, { rot: 5, size: 58 });
  g.restore();
}

function cena3(t) {
  const a = vis(t, S.ciclo, S.mec);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('LEMBRA DISSO', t, S.ciclo + 0.1, 540, 270, 64, { font: SILK, color: G, glow: 18, bold: true, align: 'center', cps: 20 });
  // trompa
  const tr = eo(k(t, S.ciclo + 0.2, 0.6));
  for (let i = 0; i < 30; i++) {
    if (i / 30 > tr) continue;
    const x = 60 + i * 32, y = 560 + Math.sin(i / 5) * 40;
    px(x, y - 60, 30, 12, rgba(CY, 0.8)); px(x, y + 60, 30, 12, rgba(CY, 0.8));
  }
  text('TROMPA', 540, 720, 30, { font: SILK, color: rgba(CY, 0.8), bold: true, align: 'center', alpha: tr });
  if (t >= S.esperma - 0.2) {
    const u = eo(k(t, S.esperma - 0.2, 1.4));

// glitch rápido na troca de cena
function glitch(t) {
  const c = CENAS.find(s => s > 0 && t >= s && t < s + 0.22);
  if (c === undefined) return;
  const u = 1 - (t - c) / 0.22;
  for (let i = 0; i < 9; i++) {
    const y = Math.floor(rnd(i + Math.floor(t * 30)) * H), h = 20 + rnd(i + 7) * 90;
    const dx = (rnd(i + 3 + Math.floor(t * 60)) - 0.5) * 120 * u;
    g.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  g.fillStyle = rgba(R, 0.12 * u); g.fillRect(0, 0, W, H);
  g.fillStyle = rgba(CY, 0.08 * u); g.fillRect(8 * u, 0, W, H);
}

window.draw = function (t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.shadowBlur = 0;

  legenda(t);
  barra(t);
  glitch(t);
  crt();
};
