<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>RENAME e REMUME</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="words.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Vídeo "RENAME.EXE": tudo é desenhado por draw(t), t em segundos da narração (narracao.mp3).
// Os tempos abaixo vêm da transcrição palavra a palavra (words.js).
const W = 1080, H = 1920;
const NARR = 109.87;            // duração da narração
window.END = NARR + 2.2;       // segura a tela final um pouco depois da última palavra
const cv = document.getElementById('c'), g = cv.getContext('2d');
const G = '#39ff6a', A = '#ffc23d', R = '#ff4d6d', CY = '#3de0ff', BG = '#020c06', WH = '#eafff0';
const SILK = "'Silk'", VT = "'VT'";

// ---------- utilidades ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const k = (t, a, d = 0.35) => cl((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.9; x = cl(x); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, u) => a + (b - a) * u;
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function text(s, x, y, size, { font = VT, color = WH, align = 'left', alpha = 1, glow = 0, bold = false, base = 'alphabetic' } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha; g.font = `${bold ? 700 : 400} ${size}px ${font}`; g.textAlign = align; g.textBaseline = base;
  if (glow) { g.shadowColor = color; g.shadowBlur = glow; }
  g.fillStyle = color; g.fillText(s, x, y); g.restore();
}
// texto digitado letra por letra (com cursor enquanto digita)
function typed(s, t, at, x, y, size, opt = {}) {
  if (t < at) return;
  const cps = opt.cps || 22;
  const n = Math.min(s.length, Math.floor((t - at) * cps) + 1);
  const shown = s.slice(0, n) + (n < s.length || opt.cursor ? (Math.floor(t * 2.5) % 2 ? '█' : ' ') : '');
  text(shown, x, y, size, opt);
}
function box(x, y, w, h, color, { lit = 0, alpha = 1, fill = 'rgba(2,20,10,0.88)', lw = 4 } = {}) {
  if (alpha <= 0) return;
  g.save(); g.globalAlpha *= alpha;
  g.fillStyle = fill; g.fillRect(x, y, w, h);
  g.shadowColor = color; g.shadowBlur = 8 + 30 * lit;
  g.strokeStyle = color; g.lineWidth = lw + 2 * lit; g.strokeRect(x, y, w, h);
  g.shadowBlur = 0;
  g.fillStyle = color; [[x, y], [x + w - 12, y], [x, y + h - 12], [x + w - 12, y + h - 12]].forEach(([a, b]) => g.fillRect(a, b, 12, 12));
  g.restore();
}
// carimbo torto que cai com impacto
function stamp(s, t, at, x, y, color, { rot = -8, size = 64, font = SILK } = {}) {
  if (t < at) return;
  const u = cl((t - at) / 0.22);
  const sc = lerp(2.6, 1, eo(u));
  const shake = u >= 1 ? Math.max(0, 1 - (t - at - 0.22) / 0.25) * 8 * Math.sin((t - at) * 90) : 0;
  g.save(); g.translate(x + shake, y); g.rotate(rot * Math.PI / 180); g.scale(sc, sc); g.globalAlpha *= cl(u * 1.6);
  g.font = `700 ${size}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(s).width + 50, h = size + 34;
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(-w / 2, -h / 2, w, h);
  g.strokeStyle = color; g.lineWidth = 8; g.shadowColor = color; g.shadowBlur = 24; g.strokeRect(-w / 2, -h / 2, w, h);
  g.lineWidth = 3; g.strokeRect(-w / 2 + 12, -h / 2 + 12, w - 24, h - 24);
  g.shadowBlur = 12; g.fillStyle = color; g.fillText(s, 0, 4);
  g.restore();
}
const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x / 6) * 6, Math.round(y / 6) * 6, Math.round(w / 6) * 6, Math.round(h / 6) * 6); };

// ---------- fundo ----------
function fundo(t) {
  const rg = g.createRadialGradient(540, 800, 100, 540, 900, 1300);
  rg.addColorStop(0, '#062a14'); rg.addColorStop(1, BG);
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  // chuva binária suave
  g.font = `34px ${VT}`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  for (let c = 0; c < 27; c++) {
    const sp = 40 + rnd(c) * 70, off = rnd(c + 50) * 2400;
    for (let r = 0; r < 14; r++) {
      const y = ((t * sp + off + r * 40) % 2400) - 300;
      const bit = (Math.floor(t * 3 + c * 7 + r * 3) % 3) === 0 ? '1' : '0';
      g.fillStyle = rgba(G, (0.03 + 0.05 * (r / 14)) * (0.6 + 0.4 * rnd(c + r)));
      g.fillText(bit, c * 40 + 6, y);
    }
  }
  // grade em perspectiva no chão
  const hy = 1380, vx = 540;
  g.save(); g.strokeStyle = rgba(G, 0.22); g.lineWidth = 2;
  for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(vx + i * 30, hy); g.lineTo(vx + i * 260, H); g.stroke(); }
  for (let j = 0; j < 14; j++) {
    const u = ((j + (t * 0.6) % 1) / 14);
    const y = hy + Math.pow(u, 2.2) * (H - hy);
    g.globalAlpha = 0.25 + 0.75 * u; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  g.restore();
  const fade = g.createLinearGradient(0, hy - 40, 0, hy + 200);
  fade.addColorStop(0, BG); fade.addColorStop(1, 'rgba(2,12,6,0)');
  g.fillStyle = fade; g.fillRect(0, hy - 40, W, 240);
}
function crt() {
  g.fillStyle = 'rgba(0,0,0,0.18)';
  for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
  const v = g.createRadialGradient(540, 960, 520, 540, 960, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.78)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function barra(t) {
  g.fillStyle = 'rgba(0,10,4,0.92)'; g.fillRect(0, 60, W, 104);
  g.fillStyle = G; g.fillRect(0, 160, W, 4);
  text('C:\\> RENAME.EXE', 40, 126, 38, { font: SILK, color: G, glow: 10, bold: true });
  const rest = Math.max(0, Math.ceil(window.END - t));
  text(`${String(Math.floor(rest / 60)).padStart(2, '0')}:${String(rest % 60).padStart(2, '0')}`, 1040, 126, 50, { color: A, align: 'right', glow: 8 });
  g.fillStyle = rgba(G, 0.18); g.fillRect(0, 164, W, 12);
  g.fillStyle = G; g.fillRect(0, 164, W * cl(t / window.END), 12);
}

// ---------- legendas palavra por palavra ----------
const KEYS = ['sozinho', 'próprio', 'federal', 'colocar', 'lei', '14654', '2023', 'estoques', 'internet', '15', 'conferir', 'disponível', 'rename', 'remume', 'sus', 'conitec', 'anos', '2024', 'componentes', 'básico', 'básica', 'estratégico', 'especializado', 'hospitalar', 'parâmetro', 'padronizarem', 'município', 'orçamento', 'posto', 'vizinha', 'padronizado', 'prefeitura', 'farmácia', 'fluoxetina', 'prozac', 'serotonina', 'sert', 'trava', 'bomba', 'isrs', 'manhã', 'sono', 'semanas', 'própria', 'náusea', 'cabeça', 'insônia', 'ansiedade', 'libido', 'receita', '344', 'c1', 'controle', 'vias', 'retida', 'trinta', 'sessenta', 'corpo', 'misturada', 'serotoninérgica', 'humor', 'neurônio', 'cérebro', 'antidepressivos', 'funciona', 'neurônios', 'imediato', 'colaterais', 'atenção', 'cuidados', 'jovens', 'profissional'];
const clean = w => w.toLowerCase().replace(/[.,!?:;]/g, '');
const GRUPOS = (() => {
  const out = []; let cur = [];
  WORDS.forEach((w, i) => {
    cur.push(w);
    const end = /[.?!:]$/.test(w.w) || cur.length >= 7 || (/,$/.test(w.w) && cur.length >= 4);
    if (end || i === WORDS.length - 1) { out.push(cur); cur = []; }
  });
  return out.map((ws, i) => {
    let key = ws.findIndex(w => KEYS.includes(clean(w.w)));
    if (key < 0) key = ws.reduce((b, w, j) => clean(w.w).length > clean(ws[b].w).length ? j : b, 0);
    return { ws, key, de: ws[0].s, ate: (out[i + 1] ? out[i + 1][0].s : ws[ws.length - 1].e + 0.5) };
  });
})();
function legenda(t) {
  if (t >= S.consulte - 0.05) return;
  const gr = GRUPOS.find(gp => t >= gp.de - 0.05 && t < gp.ate);
  if (!gr) return;
  const size = 50; g.font = `700 ${size}px ${SILK}`;
  const sp = g.measureText(' ').width;
  const items = gr.ws.map((w, j) => ({ w: w.w.toUpperCase(), s: w.s, key: j === gr.key, wd: g.measureText(w.w.toUpperCase()).width }));
  const lines = [[]]; let lw = 0;
  items.forEach(it => { if (lw + it.wd > 960 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(it); lw += it.wd + sp; });
  const y0 = 1490 - (lines.length - 1) * 34;
  lines.forEach((ln, li) => {
    const total = ln.reduce((s, it) => s + it.wd, 0) + sp * (ln.length - 1);
    let x = 540 - total / 2;
    ln.forEach(it => {
      if (t >= it.s - 0.04) {
        const u = cl((t - it.s + 0.04) / 0.12);
        g.save(); g.font = `700 ${size}px ${SILK}`; g.textBaseline = 'middle';
        g.translate(x + it.wd / 2, y0 + li * 68); g.scale(0.85 + 0.15 * u, 0.85 + 0.15 * u); g.globalAlpha = u;
        g.textAlign = 'center'; g.lineJoin = 'round'; g.lineWidth = 12; g.strokeStyle = '#000'; g.strokeText(it.w, 0, 0);
        g.fillStyle = it.key ? A : '#ffffff'; if (it.key) { g.shadowColor = A; g.shadowBlur = 14; }
        g.fillText(it.w, 0, 0); g.restore();
      }
      x += it.wd + sp;
    });
  });
}

// ---------- tempos: procurados na transcrição (palavra, ocorrência) ----------
const norm = w => w.toLowerCase().replace(/[.,!?:;]/g, '');
function T(word, n = 1) {
  let c = 0;
  for (const w of WORDS) if (norm(w.w) === word && ++c === n) return w.s;
  console.warn('tempo não achado', word, n); return 1e9;
}
const S = {
  rename: T('rename'), relacao: T('relação'), lista: T('lista'), sus: T('sus'), ministerio: T('ministério'), conitec: T('conitec'), anos: T('anos'), ed2024: T('2024'),
  comp: T('rename', 2) - 0.4, basico: T('básico'), estrategico: T('estratégico'), tuberculose: T('tuberculose'), hiv: T('hiv'), especializado: T('especializado'), complexos: T('complexos'), insumos: T('insumos'), hospitalar: T('hospitalar'),
  param: T('rename', 3) - 0.4, parametro: T('parâmetro'), estados: T('estados'), municipios: T('municípios'), remume: T('remume'), relacao2: T('relação', 2),
  monta: T('cada', 2) - 0.3, partir: T('rename', 4), basica2: T('básica', 2), doencas: T('doenças', 2), orcamento: T('orçamento'),
  isso: T('isso') - 0.6, posto: T('posto'), vizinha: T('vizinha'), padronizado: T('padronizado'),
  quer: T('quer') - 0.3, site: T('site'), farmacia: T('farmácia'),
  fora: T('colocar') - 1.5, podeSim: T('sozinho') - 1.9, sozinho: T('sozinho'), proprio: T('próprio'), recurso: T('recurso'), federal: T('federal'), estado: T('estado'), usado: T('usado'),
  lei: T('lei') - 1.4, leiNum: T('14654'), estoques: T('estoques'), quinze: T('15'), conferir: T('conferir'),
  consulte: T('consulte'),
};
const CENAS = [0, S.comp, S.param, S.monta, S.isso, S.fora, S.quer, S.lei, S.consulte - 0.05];
const vis = (t, a, b, fi = 0.25, fo = 0.25) => Math.min(cl((t - a) / fi), cl((b - t) / fo));

function cruz(x, y, s, c = G) { g.save(); g.translate(x, y); g.scale(s, s); g.shadowColor = c; g.shadowBlur = 24; px(-24, -72, 48, 144, c); px(-72, -24, 144, 48, c); g.restore(); }
// sigla que se abre letra por letra
function sigla(t, at, at2, s, palavras, y, cor) {
  if (t < at) return;
  const u = back(k(t, at, 0.35));
  const ab = eo(cl((t - at2) / 0.6));
  g.save(); g.translate(540, y - 30 * ab); g.scale(u * (1 - 0.35 * ab), u * (1 - 0.35 * ab));
  text(s, 0, 0, 150, { font: SILK, color: cor, bold: true, align: 'center', glow: 30 });
  g.restore();
  if (ab > 0) palavras.forEach((p, i) => {
    const a2 = cl((t - at2 - i * 0.18) / 0.3);
    text(p[0], 120, y + 70 + i * 62, 50, { font: SILK, color: cor, bold: true, alpha: a2, glow: 12 });
    text(p.slice(1), 160, y + 70 + i * 62, 50, { font: SILK, color: WH, bold: true, alpha: a2 });
  });
}
function cena1(t) {
  const a = vis(t, -1, S.comp + 0.05);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  sigla(t, S.rename - 0.3, S.relacao, 'RENAME', ['Relação', 'Nacional de', 'Medicamentos', 'Essenciais'], 450, G);
  stamp('LISTA OFICIAL DO SUS', t, S.sus, 540, 820, A, { rot: -5, size: 44 });
  [[S.ministerio, 'MINISTÉRIO DA SAÚDE', CY], [S.conitec, 'AVALIAÇÃO: CONITEC', CY], [S.anos, 'ATUALIZA A CADA 2 ANOS', G]].forEach(([at, s, c], i) => {
    if (t < at - 0.1) return;
    const u = eo(k(t, at - 0.1, 0.3));
    g.save(); g.translate((1 - u) * (i % 2 ? 600 : -600), 0);
    box(70, 910 + i * 100, 940, 80, c, { lit: 0.5 });
    text(s, 540, 963 + i * 100, 36, { font: SILK, color: c, bold: true, align: 'center' });
    g.restore();
  });
  stamp('EDIÇÃO 2024', t, S.ed2024, 800, 1250, R, { rot: 7, size: 40 });
  g.restore();
}

function cena2(t) {
  const a = vis(t, S.comp, S.param);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('COMPONENTES', t, S.comp + 0.1, 540, 270, 72, { font: SILK, color: G, glow: 18, bold: true, align: 'center', cps: 18 });
  const cards = [
    [S.basico, 'BÁSICO', 'atenção básica (posto de saúde)', G, S.estrategico],
    [S.estrategico, 'ESTRATÉGICO', 'ex.: tuberculose e HIV', A, S.especializado],
    [S.especializado, 'ESPECIALIZADO', 'tratamentos mais complexos', CY, S.insumos],
  ];
  cards.forEach(([at, nome, sub, cor, ate], i) => {
    if (t < at - 0.2) return;
    const u = eo(k(t, at - 0.2, 0.3));
    g.save(); g.translate((1 - u) * (i % 2 ? 600 : -600), 0);
    box(70, 340 + i * 220, 940, 190, cor, { lit: t < ate ? 0.9 : 0.15 });
    g.save(); g.shadowColor = cor; g.shadowBlur = 16; px(110, 385 + i * 220, 90, 90, cor); g.restore();
    text(String(i + 1), 155, 450 + i * 220, 60, { font: SILK, color: BG, bold: true, align: 'center' });
    text(nome, 240, 420 + i * 220, 52, { font: SILK, color: cor, bold: true, glow: 8 });
    typed(sub, t, at + 0.3, 240, 482 + i * 220, 42, { color: WH, cps: 32 });
    g.restore();
  });
  [[S.insumos, '+ INSUMOS', 80], [S.hospitalar, '+ USO HOSPITALAR', 560]].forEach(([at, s, x]) => {
    if (t < at - 0.1) return;
    const v = back(k(t, at - 0.1, 0.35));
    g.save(); g.translate(x + 220, 1060); g.scale(v, v);
    box(-220, -50, 440, 100, WH, { lit: 0.4 });
    text(s, 0, 12, 29, { font: SILK, color: WH, bold: true, align: 'center' });
    g.restore();
  });
  g.restore();
}

function cena3(t) {
  const a = vis(t, S.param, S.monta);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  // hierarquia: nacional -> estados -> municípios
  const niv = [[S.param + 0.1, 'RENAME', 'NACIONAL', G, 360], [S.estados - 0.1, 'ESTADOS', 'lista estadual', A, 560], [S.municipios - 0.1, 'MUNICÍPIOS', 'REMUME', CY, 760]];
  niv.forEach(([at, nome, sub, cor, y], i) => {
    if (t < at) return;
    const u = back(k(t, at, 0.35));
    const w = 440 + i * 200;
    g.save(); g.translate(540, y + 70); g.scale(u, u);
    box(-w / 2, -70, w, 140, cor, { lit: 0.6 });
    text(nome, 0, -4, 52, { font: SILK, color: cor, bold: true, align: 'center', glow: 10 });
    text(sub, 0, 46, 36, { color: WH, align: 'center' });
    g.restore();
    if (i > 0) { g.fillStyle = rgba(WH, 0.6); for (let yy = y - 52; yy < y; yy += 12) g.fillRect(534, yy, 12, 6); }
  });
  stamp('PARÂMETRO', t, S.parametro, 830, 330, A, { rot: 8, size: 40 });
  if (t >= S.remume - 0.2) sigla(t, S.remume - 0.2, S.relacao2, 'REMUME', ['Relação', 'Municipal de', 'Medicamentos', 'Essenciais'], 1080, CY);
  g.restore();
}

function cena4(t) {
  const a = vis(t, S.monta, S.isso);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('CADA CIDADE', t, S.monta + 0.1, 540, 260, 62, { font: SILK, color: G, glow: 18, bold: true, align: 'center', cps: 20 });
  typed('MONTA A SUA', t, S.monta + 0.8, 540, 330, 62, { font: SILK, color: G, glow: 18, bold: true, align: 'center', cps: 20 });
  // lista RENAME (esquerda) e REMUME (direita)
  box(70, 390, 420, 620, G, { lit: 0.4 });
  text('RENAME', 280, 445, 40, { font: SILK, color: G, bold: true, align: 'center' });
  box(590, 390, 420, 620, CY, { lit: 0.6 });
  text('REMUME', 800, 445, 40, { font: SILK, color: CY, bold: true, align: 'center' });
  const n = 12, escolhidos = [0, 2, 3, 6, 8, 10];
  for (let i = 0; i < n; i++) {
    const y = 485 + i * 42;
    px(100, y, 30, 24, rgba(G, 0.5)); px(140, y + 6, 300 - (i % 3) * 50, 12, rgba(WH, 0.35));
  }
  escolhidos.forEach((i, j) => {
    const at = S.partir + j * 0.35;
    if (t < at) return;
    const u = eo(cl((t - at) / 0.6));
    const y0 = 485 + i * 42, y1 = 485 + j * 70;
    const x = lerp(100, 620, u), y = lerp(y0, y1, u);
    g.save(); g.shadowColor = CY; g.shadowBlur = 12 * u; px(x, y, 30, 24, u > 0.9 ? CY : G); px(x + 40, y + 6, 260 - (i % 3) * 40, 12, rgba(WH, 0.6)); g.restore();
  });
  [[S.doencas, 'DOENÇAS MAIS COMUNS', A], [S.orcamento, 'ORÇAMENTO', R]].forEach(([at, s, c], i) => {
    if (t < at - 0.1) return;
    const v = back(k(t, at - 0.1, 0.35));
    g.save(); g.translate(i ? 800 : 300, 1100); g.scale(v, v);
    box(-230, -50, 460, 100, c, { lit: 0.7 });
    text(s, 0, 11, 25, { font: SILK, color: c, bold: true, align: 'center' });
    g.restore();
  });
  g.restore();
}

function posto(x, y, s, cor) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.shadowColor = cor; g.shadowBlur = 18; px(-180, -60, 360, 40, cor); g.shadowBlur = 0;
  px(-160, -20, 320, 180, rgba(cor, 0.12)); g.strokeStyle = cor; g.lineWidth = 6; g.strokeRect(-160, -20, 320, 180);
  px(-30, 70, 60, 90, rgba(CY, 0.4)); px(-130, 10, 70, 50, rgba(CY, 0.3)); px(60, 10, 70, 50, rgba(CY, 0.3));
  cruz(0, -40, 0.18, '#fff');
  text('POSTO DE SAÚDE', 0, 200, 26, { font: SILK, color: cor, bold: true, align: 'center' });
  g.restore();
}
function cena5(t) {
  const a = vis(t, S.isso, S.fora);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('POR ISSO...', t, S.isso + 0.1, 540, 270, 66, { font: SILK, color: A, glow: 18, bold: true, align: 'center', cps: 18 });
  const u1 = back(k(t, S.posto - 0.4, 0.4)), u2 = back(k(t, S.vizinha - 0.6, 0.4));
  if (u1 > 0) { text('CIDADE A', 280, 380, 40, { font: SILK, color: G, bold: true, align: 'center', alpha: cl(u1) }); posto(280, 520, 0.95 * u1, G); }
  if (u2 > 0) { text('CIDADE B', 800, 380, 40, { font: SILK, color: R, bold: true, align: 'center', alpha: cl(u2) }); posto(800, 520, 0.95 * u2, R); }
  if (t >= S.posto + 0.3) {
    const v = back(k(t, S.posto + 0.3, 0.35));
    g.save(); g.translate(280, 830); g.scale(v, v); box(-200, -60, 400, 120, G, { lit: 0.8 }); text('✓ TEM', 0, 16, 52, { font: SILK, color: G, bold: true, align: 'center', glow: 12 }); g.restore();
  }
  if (t >= S.vizinha) {
    const v = back(k(t, S.vizinha, 0.35));
    g.save(); g.translate(800, 830); g.scale(v, v); box(-200, -60, 400, 120, R, { lit: 0.8 }); text('✗ NÃO TEM', 0, 16, 44, { font: SILK, color: R, bold: true, align: 'center', glow: 12 }); g.restore();
  }
  stamp('NÃO PADRONIZADO NA REMUME', t, S.padronizado, 540, 1010, R, { rot: -5, size: 36 });
  g.restore();
}

function navegador(x, y, w, h, t) {
  box(x, y, w, h, CY, { lit: 0.6 });
  px(x, y, w, 50, rgba(CY, 0.3));
  [R, A, G].forEach((c, i) => px(x + 20 + i * 34, y + 14, 22, 22, c));
  box(x + 140, y + 8, w - 170, 34, WH, { lit: 0, lw: 2, fill: 'rgba(0,0,0,0.6)' });
  text('prefeitura.gov.br/saude/remume', x + 160, y + 34, 22, { font: VT, color: WH });
  for (let i = 0; i < 6; i++) { px(x + 40, y + 90 + i * 45, 30, 24, G); px(x + 90, y + 96 + i * 45, 200 + (i % 3) * 80, 12, rgba(WH, 0.5)); }
}
function cena6(t) {
  const a = vis(t, S.quer, S.lei);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('E NA SUA CIDADE?', t, S.quer + 0.1, 540, 270, 62, { font: SILK, color: G, glow: 18, bold: true, align: 'center', cps: 20 });
  if (t >= S.site - 0.6) {
    const u = eo(k(t, S.site - 0.6, 0.4));
    g.save(); g.translate(0, (1 - u) * 300); g.globalAlpha *= u; navegador(70, 340, 940, 380, t); g.restore();
  }
  stamp('PROCURE A REMUME', t, S.site, 540, 780, A, { rot: -5, size: 46 });
  if (t >= S.farmacia - 0.3) {
    const u = eo(k(t, S.farmacia - 0.3, 0.35));
    g.save(); g.translate((1 - u) * 600, 0);
    box(70, 880, 940, 180, G, { lit: 0.8 });
    cruz(170, 970, 0.5);
    text('OU PERGUNTE NA', 280, 950, 40, { font: SILK, color: G, bold: true });
    text('FARMÁCIA DO POSTO', 280, 1015, 46, { font: SILK, color: G, bold: true, glow: 10 });
    g.restore();
  }
  g.restore();
}

// ---------- Lei 14.654/2023: estoques do SUS na internet ----------
function cenaLei(t) {
  const a = vis(t, S.lei, S.consulte - 0.05);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('E TEM MAIS!', t, S.lei + 0.1, 540, 270, 70, { font: SILK, color: A, glow: 18, bold: true, align: 'center', cps: 18 });
  if (t >= S.leiNum - 0.3) {
    const u = back(k(t, S.leiNum - 0.3, 0.4));
    g.save(); g.translate(540, 400); g.scale(u, u);
    box(-420, -70, 840, 140, A, { lit: 0.8 });
    text('LEI Nº', -230, 20, 50, { font: SILK, color: A, bold: true, align: 'center', glow: 12 });
    text('14.654/2023', 120, 26, 84, { font: VT, color: A, align: 'center', glow: 12 });
    g.restore();
  }
  if (t >= S.estoques - 0.5) {
    const u = eo(k(t, S.estoques - 0.5, 0.4));
    g.save(); g.translate(0, (1 - u) * 300); g.globalAlpha *= u;
    box(70, 510, 940, 420, CY, { lit: 0.6 });
    px(70, 510, 940, 50, rgba(CY, 0.3));
    [R, A, G].forEach((c, i) => px(90 + i * 34, 524, 22, 22, c));
    text('ESTOQUE DE MEDICAMENTOS · FARMÁCIA DO POSTO', 560, 545, 22, { font: SILK, color: WH, bold: true, align: 'center' });
    const linhas = [['LOSARTANA 50 MG', 'DISPONÍVEL', G], ['METFORMINA 850 MG', 'DISPONÍVEL', G], ['SINVASTATINA 20 MG', 'EM FALTA', R], ['SALBUTAMOL SPRAY', 'DISPONÍVEL', G], ['OMEPRAZOL 20 MG', 'BAIXO', A]];
    linhas.forEach(([n, st, c], i) => {
      const at = S.estoques + i * 0.25;
      if (t < at) return;
      const y = 610 + i * 62;
      text(n, 110, y, 30, { font: SILK, color: WH, bold: true, alpha: cl((t - at) / 0.2) });
      text(st, 970, y, 30, { font: SILK, color: c, bold: true, align: 'right', alpha: cl((t - at) / 0.2), glow: 8 });
    });
    text('exemplo ilustrativo', 540, 910, 26, { color: rgba(WH, 0.5), align: 'center' });
    g.restore();
  }
  stamp('ATUALIZA A CADA 15 DIAS', t, S.quinze, 540, 1000, G, { rot: -4, size: 40 });
  if (t >= S.conferir - 0.2) {
    const u = eo(k(t, S.conferir - 0.2, 0.35));
    g.save(); g.translate((1 - u) * 600, 0);
    box(70, 1090, 940, 150, CY, { lit: 0.8 });
    text('CONFIRA ANTES DE IR', 540, 1155, 44, { font: SILK, color: CY, bold: true, align: 'center', glow: 10 });
    text('ao posto de saúde', 540, 1210, 38, { color: WH, align: 'center' });
    g.restore();
  }
  g.restore();
}

// ---------- remédio fora da RENAME: o município paga sozinho ----------
function moedas(x, y, n, cor, t) {
  for (let i = 0; i < n; i++) { g.save(); g.shadowColor = cor; g.shadowBlur = 10; px(x - 40, y - i * 18, 80, 14, cor); g.restore(); }
  text('R$', x, y + 50, 30, { font: SILK, color: cor, bold: true, align: 'center' });
}
function cenaFora(t) {
  const a = vis(t, S.fora, S.quer);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  typed('E FORA DA RENAME?', t, S.fora + 0.1, 540, 270, 58, { font: SILK, color: A, glow: 18, bold: true, align: 'center', cps: 22 });
  box(70, 330, 940, 150, G, { lit: 0.5 + 0.3 * Math.sin(t * 6) });
  typed('> o município pode padronizar?', t, S.fora + 0.4, 100, 425, 48, { color: G, glow: 10, cps: 26, cursor: t < S.podeSim });
  stamp('PODE!', t, S.podeSim, 820, 520, G, { rot: 8, size: 56 });
  if (t >= S.sozinho - 0.4) {
    const u = eo(k(t, S.sozinho - 0.4, 0.35));
    g.save(); g.translate((1 - u) * -600, 0);
    box(70, 600, 940, 200, R, { lit: t < S.recurso ? 0.9 : 0.15 });
    moedas(170, 690, 4, R, t);
    text('O MUNICÍPIO PAGA', 280, 680, 46, { font: SILK, color: R, bold: true });
    text('SOZINHO', 280, 745, 52, { font: SILK, color: R, bold: true, glow: 12 });
    if (t >= S.proprio - 0.1) text('com dinheiro próprio', 640, 745, 36, { color: WH, alpha: cl((t - S.proprio) / 0.3) });
    g.restore();
  }
  if (t >= S.recurso - 0.3) {
    const u = eo(k(t, S.recurso - 0.3, 0.35));
    g.save(); g.translate((1 - u) * 600, 0);
    box(70, 840, 940, 300, CY, { lit: 0.7 });
    text('RECURSO DA ATENÇÃO BÁSICA', 540, 900, 34, { font: SILK, color: CY, bold: true, align: 'center' });
    if (t >= S.federal - 0.1) moedas(200, 1000, 3, G, t), text('FEDERAL', 200, 1100, 28, { font: SILK, color: G, bold: true, align: 'center' });
    if (t >= S.estado - 0.1) moedas(380, 1000, 3, A, t), text('ESTADO', 380, 1100, 28, { font: SILK, color: A, bold: true, align: 'center' });
    if (t >= S.usado - 0.2) {
      const p = eo(cl((t - S.usado + 0.2) / 0.6));
      g.fillStyle = WH; for (let x = 470; x < 470 + 160 * p; x += 24) g.fillRect(x, 995, 14, 8);
      if (p > 0.9) { box(660, 950, 300, 100, G, { lit: 0.8 }); text('SÓ RENAME', 810, 1012, 32, { font: SILK, color: G, bold: true, align: 'center', glow: 12 }); }
    }
    g.restore();
  }
  g.restore();
}

function cena7(t) {
  const a = cl((t - S.consulte + 0.05) / 0.3);
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  box(70, 560, 940, 560, G, { lit: 0.6 + 0.3 * Math.sin(t * 4) });
  text('C:\\> encerrar.exe', 110, 630, 36, { color: rgba(G, 0.7) });
  ['CONSULTE UM', 'PROFISSIONAL', 'DE SAÚDE PARA', 'ORIENTAÇÕES.'].forEach((l, i) =>
    typed(l, t, S.consulte + i * 0.45, 540, 770 + i * 95, 66, { font: SILK, color: i === 1 ? A : G, bold: true, align: 'center', glow: 16, cps: 30 }));
  text('Ref.: Ministério da Saúde — RENAME 2024 · Decreto 7.508/2011 · Conitec · Lei 14.654/2023', 540, 1330, 25, { color: rgba(WH, 0.65), align: 'center', alpha: cl((t - S.consulte - 1.4) / 0.4) });
  g.restore();
}

// glitch rápido na troca de cena
function glitch(t) {
  const c = CENAS.find(s => s > 0 && t >= s && t < s + 0.22);
  if (c === undefined) return;
  const u = 1 - (t - c) / 0.22;
  for (let i = 0; i < 9; i++) {
    const y = Math.floor(rnd(i + Math.floor(t * 30)) * H), h = 20 + rnd(i + 7) * 90;
    const dx = (rnd(i + 3 + Math.floor(t * 60)) - 0.5) * 120 * u;
    g.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  g.fillStyle = rgba(R, 0.12 * u); g.fillRect(0, 0, W, H);
  g.fillStyle = rgba(CY, 0.08 * u); g.fillRect(8 * u, 0, W, H);
}

window.draw = function (t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.shadowBlur = 0;
  fundo(t);
  cena1(t); cena2(t); cena3(t); cena4(t); cena5(t); cenaFora(t); cena6(t); cenaLei(t); cena7(t);
  legenda(t);
  barra(t);
  glitch(t);
  crt();
};
window.render = window.draw;

const faces = [
  ['Silk', 'fonts/silk400.woff2', '400'], ['Silk', 'fonts/silk400ext.woff2', '400', 'U+0100-024F'],
  ['Silk', 'fonts/silk700.woff2', '700'], ['Silk', 'fonts/silk700ext.woff2', '700', 'U+0100-024F'],
  ['VT', 'fonts/vt.woff2', '400'], ['VT', 'fonts/vtext.woff2', '400', 'U+0100-024F'],
];
Promise.all(faces.map(([f, u, w, r]) => new FontFace(f, `url(${u})`, r ? { weight: w, unicodeRange: r } : { weight: w }).load().then(ff => document.fonts.add(ff))))
  .then(() => { draw(0); window.ready = true; });
</script>
